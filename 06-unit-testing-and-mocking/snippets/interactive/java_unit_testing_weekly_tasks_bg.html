<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unit Testing &amp; Mocking — Седмични задачи</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffe066;
    --surface: #ffffff;
    --surface-2: #fff0f3;
    --ink: #111111;
    --text: #111111;
    --text-dim: #444444;
    --accent: #ff5c8a;
    --accent-2: #5b8cff;
    --accent-3: #27d07a;
    --code-bg: #111111;
    --code-text: #f6f6f6;
    --shadow: 6px 6px 0 var(--ink);
    --shadow-lg: 10px 10px 0 var(--ink);
    --bw: 3px;
    --radius: 0px;
    --sidebar-w: 320px;
  }

  [data-theme="dark"] {
    --bg: #1b1b1b;
    --surface: #262626;
    --surface-2: #333333;
    --ink: #000000;
    --text: #f5f5f5;
    --text-dim: #b8b8b8;
    --accent: #ff5c8a;
    --accent-2: #5b8cff;
    --accent-3: #27d07a;
    --code-bg: #0a0a0a;
    --code-text: #f6f6f6;
    --shadow: 6px 6px 0 #000000;
    --shadow-lg: 10px 10px 0 #000000;
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; padding: 0; height: 100%; }

  body {
    font-family: "Rubik", "Arial Black", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    height: 100vh;
    overflow: hidden;
    transition: background 0.15s ease, color 0.15s ease;
  }

  /* ===== Sidebar ===== */
  aside {
    width: var(--sidebar-w);
    flex-shrink: 0;
    background: var(--surface);
    border-right: var(--bw) solid var(--ink);
    display: flex;
    flex-direction: column;
    height: 100%;
    z-index: 2;
  }

  .sidebar-head {
    padding: 22px 20px 18px;
    border-bottom: var(--bw) solid var(--ink);
    background: var(--accent);
    color: #111111;
  }

  .sidebar-head .eyebrow {
    display: inline-block;
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 800;
    margin: 0 0 8px;
    background: #111111;
    color: #ffffff;
    padding: 4px 9px;
    border: var(--bw) solid var(--ink);
    box-shadow: 3px 3px 0 #ffffff;
    transform: rotate(-2deg);
  }

  .sidebar-head h1 {
    font-size: 30px;
    margin: 0;
    font-weight: 900;
    letter-spacing: -0.02em;
    text-transform: uppercase;
    line-height: 0.95;
  }

  nav {
    flex: 1;
    overflow-y: auto;
    padding: 18px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    text-align: left;
    background: var(--surface);
    border: var(--bw) solid var(--ink);
    color: var(--text);
    font-size: 16px;
    font-weight: 700;
    padding: 12px 12px;
    cursor: pointer;
    font-family: inherit;
    box-shadow: var(--shadow);
    transition: transform 0.08s ease, box-shadow 0.08s ease, background 0.08s ease;
  }

  .nav-item:hover {
    transform: translate(-2px, -2px);
    box-shadow: 8px 8px 0 var(--ink);
    background: var(--surface-2);
  }

  .nav-item:active { transform: translate(2px, 2px); box-shadow: 3px 3px 0 var(--ink); }

  .nav-item.active {
    background: var(--accent-2);
    color: #ffffff;
    transform: translate(-2px, -2px);
    box-shadow: 8px 8px 0 var(--ink);
  }

  .nav-num {
    flex-shrink: 0;
    width: 34px;
    height: 34px;
    background: #111111;
    color: #ffffff;
    border: var(--bw) solid var(--ink);
    display: grid;
    place-items: center;
    font-size: 15px;
    font-weight: 900;
  }

  .nav-item.active .nav-num { background: var(--accent-3); color: #111111; }

  .nav-label { line-height: 1.1; }

  .sidebar-foot {
    padding: 14px 16px;
    border-top: var(--bw) solid var(--ink);
    display: flex;
    gap: 10px;
    align-items: center;
    justify-content: space-between;
    background: var(--surface-2);
  }

  .theme-btn {
    background: var(--accent-3);
    border: var(--bw) solid var(--ink);
    color: #111111;
    padding: 9px 12px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 800;
    font-family: inherit;
    display: flex;
    align-items: center;
    gap: 7px;
    box-shadow: 4px 4px 0 var(--ink);
    transition: transform 0.08s ease, box-shadow 0.08s ease;
  }

  .theme-btn:hover { transform: translate(-2px,-2px); box-shadow: 6px 6px 0 var(--ink); }
  .theme-btn:active { transform: translate(2px,2px); box-shadow: 2px 2px 0 var(--ink); }

  .zoom-group { display: flex; gap: 8px; }

  .zoom-btn {
    background: var(--accent);
    border: var(--bw) solid var(--ink);
    color: #111111;
    width: 38px;
    height: 38px;
    cursor: pointer;
    font-size: 20px;
    font-weight: 900;
    font-family: inherit;
    display: grid;
    place-items: center;
    box-shadow: 4px 4px 0 var(--ink);
    transition: transform 0.08s ease, box-shadow 0.08s ease;
  }

  .zoom-btn:hover { transform: translate(-2px,-2px); box-shadow: 6px 6px 0 var(--ink); }
  .zoom-btn:active { transform: translate(2px,2px); box-shadow: 2px 2px 0 var(--ink); }

  /* ===== Main ===== */
  main {
    flex: 1;
    overflow-y: auto;
    height: 100%;
    scroll-behavior: smooth;
    background:
      repeating-linear-gradient(45deg, transparent, transparent 22px, rgba(0,0,0,0.03) 22px, rgba(0,0,0,0.03) 23px),
      var(--bg);
  }

  [data-theme="dark"] main {
    background:
      repeating-linear-gradient(45deg, transparent, transparent 22px, rgba(255,255,255,0.03) 22px, rgba(255,255,255,0.03) 23px),
      var(--bg);
  }

  .content-wrap {
    max-width: 880px;
    margin: 0 auto;
    padding: 48px 48px 120px;
    font-size: var(--content-scale, 19px);
  }

  .topbar {
    position: sticky;
    top: 0;
    z-index: 5;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 24px;
    background: var(--surface);
    border-bottom: var(--bw) solid var(--ink);
  }

  .crumb {
    font-size: 13px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: #111111;
    background: var(--accent-3);
    border: var(--bw) solid var(--ink);
    padding: 6px 11px;
    box-shadow: 3px 3px 0 var(--ink);
  }

  .nav-arrows { display: flex; gap: 10px; }

  .arrow-btn {
    background: var(--surface);
    border: var(--bw) solid var(--ink);
    color: var(--text);
    padding: 9px 16px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 800;
    font-family: inherit;
    box-shadow: 4px 4px 0 var(--ink);
    transition: transform 0.08s ease, box-shadow 0.08s ease, background 0.08s ease;
  }

  .arrow-btn:hover:not(:disabled) {
    transform: translate(-2px,-2px);
    box-shadow: 6px 6px 0 var(--ink);
    background: var(--accent-2);
    color: #ffffff;
  }
  .arrow-btn:active:not(:disabled) { transform: translate(2px,2px); box-shadow: 2px 2px 0 var(--ink); }
  .arrow-btn:disabled { opacity: 0.4; cursor: default; box-shadow: 2px 2px 0 var(--ink); }

  /* ===== Rendered markdown ===== */
  .md h1 {
    font-size: 2.3em;
    font-weight: 900;
    letter-spacing: -0.03em;
    text-transform: uppercase;
    line-height: 1.02;
    margin: 0 0 0.7em;
    display: inline-block;
    background: var(--accent);
    color: #111111;
    padding: 12px 18px;
    border: var(--bw) solid var(--ink);
    box-shadow: var(--shadow-lg);
  }
  .md h2 {
    font-size: 1.4em;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: -0.01em;
    margin: 1.7em 0 0.6em;
    display: inline-block;
    background: var(--accent-2);
    color: #ffffff;
    padding: 6px 14px;
    border: var(--bw) solid var(--ink);
    box-shadow: 5px 5px 0 var(--ink);
  }
  .md h3 { font-size: 1.12em; font-weight: 800; margin: 1.3em 0 0.4em; text-transform: uppercase; }
  .md p { line-height: 1.7; margin: 0.85em 0; font-weight: 500; }
  .md ul, .md ol { line-height: 1.7; padding-left: 1.3em; margin: 0.85em 0; }
  .md li { margin: 0.4em 0; font-weight: 500; }
  .md ul { list-style: none; padding-left: 0; }
  .md ul > li { position: relative; padding-left: 1.5em; }
  .md ul > li::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0.5em;
    width: 12px;
    height: 12px;
    background: var(--accent);
    border: 2px solid var(--ink);
  }
  .md ul ul { padding-left: 1.2em; margin: 0.3em 0; }
  .md ul ul > li::before { background: var(--accent-2); }
  .md li > ul, .md li > ol { margin: 0.3em 0; }
  .md a { color: var(--text); font-weight: 700; text-decoration: none; background: var(--accent-3); padding: 1px 5px; border: 2px solid var(--ink); box-shadow: 2px 2px 0 var(--ink); }
  .md a:hover { background: var(--accent); }
  .md strong { font-weight: 900; }
  .md blockquote {
    margin: 1.1em 0;
    padding: 14px 18px;
    border: var(--bw) solid var(--ink);
    background: var(--accent);
    color: #111111;
    box-shadow: var(--shadow);
    font-weight: 700;
  }
  .md blockquote p { margin: 0.2em 0; }
  .md blockquote code { background: #111111; color: #ffffff; }
  .md code {
    font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
    background: var(--surface-2);
    border: 2px solid var(--ink);
    padding: 0.08em 0.4em;
    font-size: 0.84em;
    font-weight: 700;
  }
  .md pre {
    background: var(--code-bg);
    color: var(--code-text);
    border: var(--bw) solid var(--ink);
    padding: 20px 22px;
    overflow-x: auto;
    margin: 1.2em 0;
    line-height: 1.55;
    box-shadow: var(--shadow);
  }
  .md pre code {
    background: none;
    border: none;
    padding: 0;
    font-size: 0.9em;
    color: var(--code-text);
    font-weight: 500;
  }

  /* chunky scrollbars */
  nav::-webkit-scrollbar, main::-webkit-scrollbar { width: 14px; }
  nav::-webkit-scrollbar-track, main::-webkit-scrollbar-track { background: var(--surface-2); border-left: 2px solid var(--ink); }
  nav::-webkit-scrollbar-thumb, main::-webkit-scrollbar-thumb { background: var(--accent); border: 2px solid var(--ink); }

  @media (max-width: 760px) {
    :root { --sidebar-w: 100%; }
    body { flex-direction: column; overflow: auto; }
    aside { height: auto; border-right: none; border-bottom: var(--bw) solid var(--ink); }
    nav { flex-direction: row; overflow-x: auto; padding: 12px; }
    .nav-item { white-space: nowrap; }
    .nav-label { display: none; }
    .content-wrap { padding: 28px 20px 80px; }
    .md h1 { font-size: 1.7em; }
  }

.code-wrap { position: relative; margin: 1.2em 0; }
.code-wrap pre { margin: 0; padding-top: 52px; }
.copy-btn {
  position: absolute; top: 10px; right: 10px; z-index: 1;
  border: 2px solid var(--ink); background: var(--accent-3); color: #111;
  padding: 7px 11px; font: 800 13px inherit; cursor: pointer;
  box-shadow: 3px 3px 0 var(--ink);
}
.copy-btn:hover { transform: translate(-1px,-1px); box-shadow: 4px 4px 0 var(--ink); }
.copy-btn.copied { background: var(--accent); }

/* ===== Collapsible solutions ===== */
.solution {
  margin: 1.8em 0 1.2em;
  background: var(--surface);
  border: var(--bw) solid var(--ink);
  box-shadow: var(--shadow);
}

/* ===== Hint block ===== */
.hint {
  margin: 1.8em 0 1.2em;
  background: var(--surface);
  border: var(--bw) solid var(--ink);
  box-shadow: var(--shadow);
}
.hint > summary {
  list-style: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 18px;
  background: var(--accent-2);
  color: #ffffff;
  font-weight: 900;
  font-size: 1.05em;
  text-transform: uppercase;
  letter-spacing: 0.02em;
  user-select: none;
}
.hint > summary::-webkit-details-marker { display: none; }
.hint > summary::after {
  content: "Покажи ▾";
  font-size: 0.7em;
  font-weight: 800;
  background: #111111;
  color: #ffffff;
  padding: 4px 9px;
}
.hint[open] > summary::after { content: "Скрий ▴"; }
.hint > summary:hover { filter: brightness(1.1); }
.hint > summary:focus-visible { outline: var(--bw) solid var(--accent); outline-offset: 3px; }
.hint[open] > summary { border-bottom: var(--bw) solid var(--ink); }
.hint-body { padding: 6px 22px 14px; }
.solution > summary {
  list-style: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 18px;
  background: var(--accent-3);
  color: #111111;
  font-weight: 900;
  font-size: 1.05em;
  text-transform: uppercase;
  letter-spacing: 0.02em;
  user-select: none;
}
.solution > summary::-webkit-details-marker { display: none; }
.solution > summary::after {
  content: "Покажи ▾";
  font-size: 0.7em;
  font-weight: 800;
  background: #111111;
  color: #ffffff;
  padding: 4px 9px;
}
.solution[open] > summary::after { content: "Скрий ▴"; }
.solution > summary:hover { background: var(--accent); }
.solution > summary:focus-visible { outline: var(--bw) solid var(--accent-2); outline-offset: 3px; }
.solution[open] > summary { border-bottom: var(--bw) solid var(--ink); }
.solution-body { padding: 6px 22px 14px; }
</style>
</head>

  <aside>
    <div class="sidebar-head">
      <p class="eyebrow">Седмични упражнения</p>

    <div class="sidebar-foot">
      <button class="theme-btn" id="themeBtn" title="Смяна на темата">

    <div class="content-wrap">
      <article class="md" id="content"></article>
    </div>

<script>
const PROBLEMS = [{"id": "01", "title": "Password Checker", "md": "# Password Checker\n\n## Цел\n\nСтудентите да мислят като тестери преди да докоснат клавиатурата — измислянето на сценарии е отделна, важна стъпка преди писането на тестове. Упражнява именуване на тестове и идентифициране на гранични случаи. **~15 минути.**\n\n---\n\n## Условие\n\nДаден е следният метод:\n\n```java\nboolean isStrongPassword(String password)\n```\n\nПаролата се счита за силна ако отговаря на **всички** от следните критерии:\n\n- Минимум 8 символа\n- Поне една главна буква (A-Z)\n- Поне една малка буква (a-z)\n- Поне една цифра (0-9)\n- Поне един специален символ от: `!@#$%^&*`\n\n**Без да пишете код** — избройте всички сценарии, които бихте тествали. За всеки сценарий — как би се казвал тестовият метод?\n\n---\n\n## Стъпки и изпълнение\n\n### Стъпка 1 — дайте време за мислене\n\nДайте 5-7 минути за индивидуална работа или по двойки. Не подсказвайте.\n\nПосле поискайте от студентите да споделят сценариите си.\n\n---\n\n### Стъпка 2 — happy path\n\n**Питате:** \"Кой има сценарий, в който паролата минава?\"\n\n**Очаквате:** `testValidPasswordReturnsTrue` — стандартна силна парола с всички критерии.\n\n**Казвате:** \"Как би изглеждала паролата в теста?\" — насочете към конкретна стойност като `\"StrongP@ss1\"`.\n\n---\n\n### Стъпка 3 — по един критерий наведнъж\n\n**Питате:** \"Кои сценарии проверяват точно един липсващ критерий?\"\n\n**Очаквате** студентите да изброят:\n- без главна буква → `testNoUppercaseReturnsFalse`\n- без малка буква → `testNoLowercaseReturnsFalse`\n- без цифра → `testNoDigitReturnsFalse`\n- без специален символ → `testNoSpecialCharReturnsFalse`\n- под 8 символа → `testTooShortPasswordReturnsFalse`\n\n**Ако пропуснат някой** — питате: \"Има ли още критерий, който може да липсва?\"\n\n---\n\n### Стъпка 4 — гранични случаи\n\nНатиснете с въпроси един по един:\n\n**Питате:** \"Точно 8 символа — минава ли? Точно 7?\"\n\n**Очаквате:** `testExactlyEightCharsReturnsTrue` и `testSevenCharsReturnsFalse`.\n\n**Питате:** \"Празен стринг `\"\"`?\"\n\n**Очаквате:** `testEmptyStringReturnsFalse`.\n\n**Питате:** \"Само интервали `\"        \"` — 8 символа, но?\"\n\n**Очаквате:** объркване. Насочете: \"8 символа, всички критерии ли са изпълнени?\" → не, няма главна, цифра, специален символ. Но `testOnlyWhitespacesReturnsFalse` е добър отделен сценарий.\n\n**Питате:** \"Специален символ извън позволените — `€`, `ñ`, `😀`?\"\n\n**Очаквате:** повечето не са се сетили. → `testDisallowedSpecialCharReturnsFalse`.\n\n---\n\n### Стъпка 5 — null\n\n**Питате:** \"Какво се случва при `null`?\"\n\n**Очаквате:** дискусия — хвърля ли `NullPointerException` или връща `false`?\n\n**Казвате:** \"Кое е по-добро?\" — няма правилен отговор без спецификация. `testIsStrongPasswordWithNullShouldThrow` **или** `testIsStrongPasswordWithNullShouldReturnFalse` — зависи от това какво сте договорили. Точно затова спецификацията е важна.\n\n---\n\n### Стъпка 6 — именуване\n\n**Питате:** \"Ако тестът се казва `test1` — какво тества?\"\n\n**Очаквате:** \"Не знаем.\"\n\n**Казвате:** `testNullThrows` е самодокументиращ се — методът, входът, очакваният резултат. Тестовото име е документация.\n\n---\n\n### Стъпка 7 — бонус: performance\n\n**Питате:** \"Има ли сценарий, който не може да се тества с `assertEquals` или `assertTrue`?\"\n\n**Насочете:** \"Имплементацията проверява символ по символ. Ако някой подаде парола с 10 милиона символа — тестът ти ще мине, но колко бързо?\"\n\n**Очаквате:** студентите предлагат нещо от сорта на `assertTrue(duration < 100ms)`.\n\n**Казвате:** \"Точно такъв assertion съществува — `assertTimeout`. Ще го видите в следващата задача.\"\n\n---\n\n## Решение\n\n### Минава (връща `true`)\n- `testValidPasswordReturnsTrue`\n- `testExactlyEightCharsReturnsTrue`\n\n### Не минава (връща `false`)\n- `testTooShortPasswordReturnsFalse`\n- `testNoUppercaseReturnsFalse`\n- `testNoLowercaseReturnsFalse`\n- `testNoDigitReturnsFalse`\n- `testNoSpecialCharReturnsFalse`\n- `testOnlyWhitespacesReturnsFalse`\n- `testDisallowedSpecialCharReturnsFalse`\n- `testSevenCharsReturnsFalse`\n- `testEmptyStringReturnsFalse`\n\n### Изключения / null\n- `testNullThrows` **или** `testNullReturnsFalse`\n"}, {"id": "02", "title": "TDD — isPrime()", "md": "# TDD — isPrime()\n\n## Цел\n\nСтудентите да преживеят пълния TDD цикъл: 🔴 червено → 🟢 зелено → 🔵 рефактор. Да видят как тестът се пише преди имплементацията, как фейлва, как светва зелено, и как се опитват да го счупят с неочаквани входове. Упражнява `@Test`, `assertTrue`/`assertFalse`, `assertThrows`, `assertTimeout`. **~25 минути.**\n\n---\n\n## Условие\n\nДадена е следната сигнатура:\n\n```java\nclass PrimeChecker {\n    static boolean isPrime(int n) {\n        throw new UnsupportedOperationException(\"Not implemented yet\");\n    }\n}\n```\n\n**Спецификация:**\n- Връща `true` ако `n` е просто число\n- Връща `false` ако `n` не е просто число\n- Хвърля `IllegalArgumentException` ако `n < 0`\n\n**Следвайки TDD цикъла (🔴 червено → 🟢 зелено → 🔵 рефактор), напишете тестовете преди имплементацията.**\n\n---\n\n## Стъпки и изпълнение\n\n### Стъпка 1 🔴 — напишете тестовете първо\n\n**Показвате** сигнатурата на лаптопа. Имплементацията хвърля `UnsupportedOperationException` — умишлено.\n\n**Питате:** \"Преди да пишем каквато и да е имплементация — какви тестове бихте написали?\"\n\n**Изчаквате** предложения, после показвате тестовете:\n\n```java\n@Test\nvoid testTwoIsPrime() {\n    assertTrue(PrimeChecker.isPrime(2));\n}\n\n@Test\nvoid testThreeIsPrime() {\n    assertTrue(PrimeChecker.isPrime(3));\n}\n\n@Test\nvoid testFourIsNotPrime() {\n    assertFalse(PrimeChecker.isPrime(4));\n}\n\n@Test\nvoid testOneIsNotPrime() {\n    assertFalse(PrimeChecker.isPrime(1));\n}\n\n@Test\nvoid testZeroIsNotPrime() {\n    assertFalse(PrimeChecker.isPrime(0));\n}\n\n@Test\nvoid testNegativeThrowsException() {\n    assertThrows(IllegalArgumentException.class, () -> PrimeChecker.isPrime(-1));\n}\n```\n\n**Пускате тестовете.** Всички трябва да фейлват с `UnsupportedOperationException`.\n\n**Питате:** \"Всички червени — добре ли е това?\"\n\n**Казвате:** \"Да. Червеният тест означава, че тестът работи правилно. Ако тестът минава преди имплементацията — нещо не е наред.\"\n\n---\n\n### Стъпка 2 🟢 — минималното зелено\n\n**Питате:** \"Каква е най-простата имплементация, която кара тестовете да минат?\"\n\n**Изчаквате** предложения. После показвате:\n\n```java\nstatic boolean isPrime(int n) {\n    if (n < 0) throw new IllegalArgumentException(\"n must be non-negative\");\n    if (n < 2) return false;\n    for (int i = 2; i < n; i++) {\n        if (n % i == 0) return false;\n    }\n    return true;\n}\n```\n\n**Пускате тестовете.** Всички зелени.\n\n**Казвате:** \"Не оптимизираме. Първо зелено, после рефактор.\"\n\n---\n\n### Стъпка 3 🔨 — опитайте се да го счупите\n\n**Питате:** \"Има ли входове, с които може да счупим имплементацията?\"\n\n**Показвате** допълнителни тестове:\n\n```java\n@Test\nvoid testMaxIntIsPrime() {\n    assertTrue(PrimeChecker.isPrime(Integer.MAX_VALUE)); // 2147483647 е просто\n}\n\n@Test\nvoid testMaxIntMinusOneIsNotPrime() {\n    assertFalse(PrimeChecker.isPrime(Integer.MAX_VALUE - 1)); // четно\n}\n```\n\n**Питате:** \"Защо 1 не е просто?\"\n\n**Казвате:** \"По дефиниция — просто е число с точно два делителя: 1 и себе си. 1 има само един делител.\"\n\n**Пускате тестовете.** `testMaxIntIsPrime` ще се бави осезаемо с наивната имплементация.\n\n---\n\n### Стъпка 4 ⏱️ — `assertTimeout`\n\n**Показвате:**\n\n```java\n@Test\nvoid testMaxIntPerformance() {\n    assertTimeout(Duration.ofMillis(1000), () -> PrimeChecker.isPrime(Integer.MAX_VALUE));\n}\n```\n\n**Пускате теста.** При наивна O(n) имплементация — фейлва.\n\n**Питате:** \"Как да го оправим без да сменяме теста?\"\n\n**Изчаквате** предложения.\n\n---\n\n### Стъпка 5 🔵 — рефактор\n\n**Показвате** оптимизацията:\n\n```java\nfor (int i = 2; i * i <= n; i++) {\n    if (n % i == 0) return false;\n}\n```\n\n**Питате:** \"Защо `i * i <= n` е достатъчно?\"\n\n**Казвате:** \"Ако `n` има делител по-голям от `√n`, той задължително има и делител по-малък от `√n`. Не е нужно да проверяваме отвъд корена.\"\n\n**Пускате всички тестове.** Всички зелени, `assertTimeout` вече минава.\n\n**Казвате:** \"Рефакторът е безопасен — тестовете пазят гърба ни.\"\n\n---\n\n## Решение\n\n```java\nclass PrimeCheckerTest {\n\n    @Test\n    void testTwoIsPrime() { assertTrue(PrimeChecker.isPrime(2)); }\n\n    @Test\n    void testThreeIsPrime() { assertTrue(PrimeChecker.isPrime(3)); }\n\n    @Test\n    void testFourIsNotPrime() { assertFalse(PrimeChecker.isPrime(4)); }\n\n    @Test\n    void testOneIsNotPrime() { assertFalse(PrimeChecker.isPrime(1)); }\n\n    @Test\n    void testZeroIsNotPrime() { assertFalse(PrimeChecker.isPrime(0)); }\n\n    @Test\n    void testNegativeThrowsException() {\n        assertThrows(IllegalArgumentException.class, () -> PrimeChecker.isPrime(-1));\n    }\n\n    @Test\n    void testMaxIntIsPrime() {\n        assertTrue(PrimeChecker.isPrime(Integer.MAX_VALUE));\n    }\n\n    @Test\n    void testMaxIntPerformance() {\n        assertTimeout(Duration.ofMillis(1000), () -> PrimeChecker.isPrime(Integer.MAX_VALUE));\n    }\n}\n```\n"}, {"id": "03", "title": "BankAccount", "md": "# BankAccount\n\n## Цел\n\nСтудентите да видят повторението в тестовете органично и сами да стигнат до `@BeforeEach`. Упражнява `assertEquals` с делта, `assertThrows`, `@BeforeEach`. **~15 минути.**\n\n---\n\n## Условие\n\n```java\nclass BankAccount {\n    private double balance;\n\n    BankAccount(double initialBalance) {\n        this.balance = initialBalance;\n    }\n\n    void deposit(double amount) {\n        if (amount <= 0) throw new IllegalArgumentException(\"Amount must be positive\");\n        balance += amount;\n    }\n\n    void withdraw(double amount) {\n        if (amount <= 0) throw new IllegalArgumentException(\"Amount must be positive\");\n        if (amount > balance) throw new IllegalStateException(\"Insufficient funds\");\n        balance -= amount;\n    }\n\n    double getBalance() {\n        return balance;\n    }\n}\n```\n\n**Спецификация:**\n- `deposit(amount)` → увеличава баланса; хвърля `IllegalArgumentException` ако `amount <= 0`\n- `withdraw(amount)` → намалява баланса; хвърля `IllegalArgumentException` ако `amount <= 0`; хвърля `IllegalStateException` ако няма достатъчно средства\n- `getBalance()` → връща текущия баланс\n\n**Напишете тестове за всички сценарии.**\n\n---\n\n## Стъпки и изпълнение\n\n### Стъпка 1 — напишете тестовете\n\nДайте 5 минути да напишат тестовете. Не подсказвайте.\n\n**Очаквате** нещо от сорта:\n\n```java\n@Test\nvoid testDepositIncreasesBalance() {\n    BankAccount account = new BankAccount(100.0);\n    account.deposit(50.0);\n    assertEquals(150.0, account.getBalance(), 0.001);\n}\n\n@Test\nvoid testWithdrawDecreasesBalance() {\n    BankAccount account = new BankAccount(100.0);\n    account.withdraw(30.0);\n    assertEquals(70.0, account.getBalance(), 0.001);\n}\n\n@Test\nvoid testWithdrawInsufficientFundsThrows() {\n    BankAccount account = new BankAccount(100.0);\n    assertThrows(IllegalStateException.class, () -> account.withdraw(200.0));\n}\n\n@Test\nvoid testDepositNegativeThrows() {\n    BankAccount account = new BankAccount(100.0);\n    assertThrows(IllegalArgumentException.class, () -> account.deposit(-10.0));\n}\n```\n\n**Пускате тестовете.** Всички зелени.\n\n---\n\n### Стъпка 2 — забелязвате повторението\n\n**Питате:** \"Забелязвате ли нещо повтарящо се?\"\n\n**Очаквате:** \"`new BankAccount(100.0)` се повтаря във всеки тест.\"\n\n**Питате:** \"Защо не го изнесем като поле?\"\n\n**Очаквате:** \"Ами ако един тест промени баланса — следващият тест ще получи мръсно състояние.\"\n\n**Казвате:** \"Точно. Трябва ни нещо, което да прави `new BankAccount(100.0)` **преди всеки** тест.\"\n\n---\n\n### Стъпка 3 — `@BeforeEach`\n\n**Показвате** рефактора:\n\n```java\nBankAccount account;\n\n@BeforeEach\nvoid setUp() {\n    account = new BankAccount(100.0);\n}\n```\n\n**Казвате:** \"`@BeforeEach` се изпълнява преди всеки тест — JUnit създава нова инстанция на тестовия клас за всеки тест, после вика `setUp()`. Всеки тест получава чист обект.\"\n\n**Пускате тестовете.** Всички зелени.\n\n---\n\n### Стъпка 4 — защо е важно\n\n**Питате:** \"Какво би се случило ако ползвахме `BankAccount account = new BankAccount(100.0)` директно като поле (без `@BeforeEach`)?\"\n\n**Казвате:** \"В JUnit 5 — всеки тест получава **нова инстанция** на тестовия клас, така че би работило. Но `@BeforeEach` е по-изричен и ви позволява да правите допълнителна логика (напр. да подготвяте мокове — ще го видите в следващата задача).\"\n\n---\n\n## Решение\n\n```java\nclass BankAccountTest {\n\n    BankAccount account;\n\n    @BeforeEach\n    void setUp() {\n        account = new BankAccount(100.0);\n    }\n\n    @Test\n    void testDepositIncreasesBalance() {\n        account.deposit(50.0);\n        assertEquals(150.0, account.getBalance(), 0.001);\n    }\n\n    @Test\n    void testWithdrawDecreasesBalance() {\n        account.withdraw(30.0);\n        assertEquals(70.0, account.getBalance(), 0.001);\n    }\n\n    @Test\n    void testWithdrawInsufficientFundsThrows() {\n        assertThrows(IllegalStateException.class, () -> account.withdraw(200.0));\n    }\n\n    @Test\n    void testDepositNegativeThrows() {\n        assertThrows(IllegalArgumentException.class, () -> account.deposit(-10.0));\n    }\n}\n```\n"}, {"id": "04", "title": "BookingService", "md": "# BookingService\n\n## Цел\n\nСтудентите да разберат защо `new X()` вътре в клас прави тестването невъзможно, и как DI + мок го решават. Упражнява `mock()`, `when().thenReturn()`, `when().thenThrow()`, `verify()`, `verify(mock, never())`, `verify(mock, times(n))`, `anyString()`, `eq()`. **~20 минути.**\n\n---\n\n## Условие\n\nДадена е следната имплементация:\n\n```java\nclass BookingService {\n\n    private final InviteSender sender = new CalendarInviteSender();\n\n    boolean book(String userEmail, String slot) {\n        if (userEmail == null || userEmail.isBlank()) {\n            throw new IllegalArgumentException(\"user email should not be null or blank\");\n        }\n        if (slot == null || slot.isBlank()) {\n            throw new IllegalArgumentException(\"slot should not be null or blank\");\n        }\n        if (!sender.isUserAvailable(userEmail, slot)) {\n            return false;\n        }\n        sender.sendInvite(userEmail, slot);\n        return true;\n    }\n}\n\ninterface InviteSender {\n    void sendInvite(String email, String slot);\n    boolean isUserAvailable(String email, String slot);\n}\n\nclass CalendarInviteSender implements InviteSender {\n    @Override\n    public void sendInvite(String email, String slot) {\n        throw new UnsupportedOperationException(\"you should not be calling me\");\n    }\n\n    @Override\n    public boolean isUserAvailable(String email, String slot) {\n        throw new UnsupportedOperationException(\"you should not be calling me\");\n    }\n}\n```\n\n**Спецификация:**\n- `book(null, slot)` или `book(email, null)` → хвърля `IllegalArgumentException`\n- `book(\"\", slot)` или `book(email, \"\")` → хвърля `IllegalArgumentException`\n- `book(email, slot)` когато потребителят е свободен → връща `true` и изпраща покана\n- `book(email, slot)` когато потребителят е зает → връща `false`, НЕ изпраща покана\n\n**Напишете тестове за всички сценарии от спецификацията.**\n\n## Hint\n\nПозволява ли сегашната структура на кода лесно тестване? Ако не — какво би трябвало да промените, преди да пишете тестовете?\n\n---\n\n## Стъпки и изпълнение\n\n### Стъпка 1 — проблемът\n\n**Показвате** имплементацията на лаптопа.\n\n**Питате:** \"Как ще тествате дали `sendInvite()` е извикан?\"\n\n**Изчаквате** предложения. Насочете с въпроси:\n- \"Имате ли достъп до `sender` от теста?\"\n- \"Ако `CalendarInviteSender` проверява реален календар — какво се случва при всеки тест?\"\n- \"Имате ли начин да подмените `sender` с нещо под ваш контрол?\"\n\n**Казвате:** \"`new CalendarInviteSender()` вътре в класа = зависимостта е скрита. Не можем да я подменим. Решението: DI.\"\n\n---\n\n### Стъпка 2 — рефактор към DI\n\n**Показвате** рефактора:\n\n```java\nclass BookingService {\n    private final InviteSender sender;\n\n    BookingService(InviteSender sender) {\n        this.sender = sender;\n    }\n\n    boolean book(String userEmail, String slot) {\n        if (userEmail == null || userEmail.isBlank()) {\n            throw new IllegalArgumentException(\"user email should not be null or blank\");\n        }\n        if (slot == null || slot.isBlank()) {\n            throw new IllegalArgumentException(\"slot should not be null or blank\");\n        }\n        if (!sender.isUserAvailable(userEmail, slot)) {\n            return false;\n        }\n        sender.sendInvite(userEmail, slot);\n        return true;\n    }\n}\n```\n\n**Казвате:** \"Конструкторът е документация: за да работя, имам нужда от `InviteSender`. Веднъж видима — зависимостта може да се подмени.\"\n\n---\n\n### Стъпка 3 — `mock()` + `when()` + `verify()`\n\n**Питате:** \"Мокът по подразбиране връща `false` за boolean методи. Какво ще се случи ако пуснем теста без `when()`?\"\n\n**Изчаквате.** После показвате:\n\n```java\nInviteSender sender = mock(InviteSender.class);\nBookingService service = new BookingService(sender);\n```\n\n**Показвате** setup-а за happy path теста:\n\n```java\n@Test\nvoid testBookWhenUserAvailableReturnsTrueAndSendsInvite() {\n    when(sender.isUserAvailable(\"alice@example.com\", \"10:00\")).thenReturn(true);\n\n    boolean result = service.book(\"alice@example.com\", \"10:00\");\n\n    assertTrue(result);\n    verify(sender).sendInvite(\"alice@example.com\", \"10:00\");\n}\n```\n\n**Питате:** \"Защо трябват и `when()`, и `verify()` тук?\"\n\n**Казвате:** \"`when()` контролира поведението на query метода — `isUserAvailable` определя кой branch се изпълнява. `verify()` проверява дали command-ът — `sendInvite` — е бил извикан. Два различни въпроса.\"\n\n---\n\n### Стъпка 4 — `verify(mock, never())` когато потребителят е зает\n\n**Показвате:**\n\n```java\n@Test\nvoid testBookWhenUserNotAvailableReturnsFalseAndDoesNotSendInvite() {\n    when(sender.isUserAvailable(\"alice@example.com\", \"10:00\")).thenReturn(false);\n\n    boolean result = service.book(\"alice@example.com\", \"10:00\");\n\n    assertFalse(result);\n    verify(sender, never()).sendInvite(anyString(), anyString());\n}\n```\n\n**Питате:** \"Как иначе бихте проверили, че `sendInvite` НЕ е бил извикан?\"\n\n**Казвате:** \"`verify(mock, never())` е единственият начин да докажете отсъствие на действие. Не можете да го направите с `assert*`.\"\n\n---\n\n### Стъпка 5 — `assertThrows` за невалидни аргументи\n\n**Показвате** тестовете за null/blank:\n\n```java\n@Test\nvoid testBookWithNullEmailThrows() {\n    assertThrows(IllegalArgumentException.class,\n        () -> service.book(null, \"10:00\"));\n}\n\n@Test\nvoid testBookWithBlankEmailThrows() {\n    assertThrows(IllegalArgumentException.class,\n        () -> service.book(\"   \", \"10:00\"));\n}\n```\n\n**Питате:** \"Трябва ли `when(sender.isUserAvailable(...))` тук?\"\n\n**Казвате:** \"Не — изключението се хвърля преди `isUserAvailable()` да може да бъде извикан. Мокът не влиза в игра.\"\n\n---\n\n### Стъпка 6 — argument matchers\n\n**Показвате:**\n\n```java\n// не ме интересува стойността, само да е String\nverify(sender).sendInvite(anyString(), anyString());\n\n// само за конкретния слот, независимо кой е потребителят\nverify(sender).sendInvite(anyString(), eq(\"10:00\"));\n```\n\n**Питате:** \"Кога `eq()` е нужен?\"\n\n**Казвате:** \"Когато смесвате матчъри и литерали — всички аргументи трябва да са матчъри. `eq()` обвива литерал в матчър.\"\n\n**Покажете грешката:**\n```java\nverify(sender).sendInvite(\"alice@example.com\", anyString()); // грешка!\nverify(sender).sendInvite(eq(\"alice@example.com\"), anyString()); // правилно\n```\n\n---\n\n### Стъпка 7 — `thenThrow()`\n\n**Питате:** \"Какво се случва ако `isUserAvailable()` хвърли изключение — например проблем с мрежата?\"\n\n**Показвате:**\n\n```java\n@Test\nvoid testBookWhenAvailabilityCheckThrowsShouldPropagate() {\n    when(sender.isUserAvailable(anyString(), anyString()))\n        .thenThrow(new RuntimeException(\"Calendar service unavailable\"));\n\n    assertThrows(RuntimeException.class,\n        () -> service.book(\"alice@example.com\", \"10:00\"));\n}\n```\n\n**Казвате:** \"`thenThrow()` симулира грешка от зависимост. Не се налага реалният calendar service да е счупен — контролираме го в теста.\"\n\n**Пускате теста.** Зелено.\n\n---\n\n## Очаквани тестове\n\n```java\nclass BookingServiceTest {\n\n    InviteSender sender;\n    BookingService service;\n\n    @BeforeEach\n    void setUp() {\n        sender = mock(InviteSender.class);\n        service = new BookingService(sender);\n    }\n\n    @Test\n    void testBookWhenUserAvailableReturnsTrueAndSendsInvite() {\n        when(sender.isUserAvailable(\"alice@example.com\", \"10:00\")).thenReturn(true);\n\n        boolean result = service.book(\"alice@example.com\", \"10:00\");\n\n        assertTrue(result);\n        verify(sender).sendInvite(\"alice@example.com\", \"10:00\");\n    }\n\n    @Test\n    void testBookWhenUserNotAvailableReturnsFalseAndDoesNotSendInvite() {\n        when(sender.isUserAvailable(\"alice@example.com\", \"10:00\")).thenReturn(false);\n\n        boolean result = service.book(\"alice@example.com\", \"10:00\");\n\n        assertFalse(result);\n        verify(sender, never()).sendInvite(anyString(), anyString());\n    }\n\n    @Test\n    void testBookWithNullEmailThrows() {\n        assertThrows(IllegalArgumentException.class,\n            () -> service.book(null, \"10:00\"));\n    }\n\n    @Test\n    void testBookWithBlankEmailThrows() {\n        assertThrows(IllegalArgumentException.class,\n            () -> service.book(\"   \", \"10:00\"));\n    }\n\n    @Test\n    void testBookWithNullSlotThrows() {\n        assertThrows(IllegalArgumentException.class,\n            () -> service.book(\"alice@example.com\", null));\n    }\n\n    @Test\n    void testBookWithBlankSlotThrows() {\n        assertThrows(IllegalArgumentException.class,\n            () -> service.book(\"alice@example.com\", \"\"));\n    }\n\n    @Test\n    void testBookSendsInviteWithSpecificSlot() {\n        when(sender.isUserAvailable(anyString(), eq(\"10:00\"))).thenReturn(true);\n\n        service.book(\"alice@example.com\", \"10:00\");\n\n        verify(sender).sendInvite(anyString(), eq(\"10:00\"));\n    }\n\n    @Test\n    void testBookWhenAvailabilityCheckThrowsShouldPropagate() {\n        when(sender.isUserAvailable(anyString(), anyString()))\n            .thenThrow(new RuntimeException(\"Calendar service unavailable\"));\n\n        assertThrows(RuntimeException.class,\n            () -> service.book(\"alice@example.com\", \"10:00\"));\n    }\n}\n```\n"}, {"id": "05", "title": "HotelPricing", "md": "# HotelPricing\n\n## Цел\n\nСтудентите инстинктивно ще ползват мок (тепърва са го научили), но задачата е капан: зависимостта е query обект с три метода — `verify()` е безсмислен. Целта е сами да стигнат до стъба. Упражнява ръчен стъб, разграничението query vs command, и кога мокът е излишен. **~15 минути.**\n\n---\n\n## Условие\n\nДадена е следната структура:\n\n```java\ninterface RoomType {\n    double getBaseNightlyRate();\n    double getWeekendSurcharge();\n    int getMaxOccupancy();\n}\n\nclass HotelPricing {\n    private final RoomType room;\n\n    HotelPricing(RoomType room) {\n        this.room = room;\n    }\n\n    double calculateStay(int nights, int weekendNights, int guests) {\n        if (guests > room.getMaxOccupancy()) {\n            throw new IllegalArgumentException(\"Too many guests for this room type\");\n        }\n        double base = room.getBaseNightlyRate() * nights;\n        double surcharge = room.getBaseNightlyRate() * room.getWeekendSurcharge() * weekendNights;\n        return base + surcharge;\n    }\n}\n```\n\n**Спецификация** (стая с базова цена 80.0€ и уикенд коефициент 0.30, максимум 2 гости):\n- `calculateStay(3, 0, 2)` → `240.0`\n- `calculateStay(3, 1, 2)` → `264.0`\n- `calculateStay(3, 0, 5)` → хвърля `IllegalArgumentException`\n\n**Напишете тестове за всички сценарии.**\n\n---\n\n## Стъпки и изпълнение\n\n### Стъпка 1 — опитайте с мок\n\n**Питате:** \"Как ще тествате `calculateStay()`? Имате нужда от `RoomType`.\"\n\n**Изчаквате** предложения. Повечето ще предложат мок след Задача 3.\n\n**Оставете** ги да напишат setup-а:\n\n```java\nRoomType room = mock(RoomType.class);\nwhen(room.getBaseNightlyRate()).thenReturn(80.0);\nwhen(room.getWeekendSurcharge()).thenReturn(0.30);\nwhen(room.getMaxOccupancy()).thenReturn(2);\nHotelPricing pricing = new HotelPricing(room);\n```\n\n**Пускате тестовете.** Зелено.\n\n---\n\n### Стъпка 2 — ключовият въпрос\n\n**Питате:** \"Добавихте ли `verify()` някъде?\"\n\n**Изчаквате.** Почти никой няма да го е добавил.\n\n**Питате:** \"Защо не?\"\n\n**Изчаквате** отговор. После:\n\n**Питате:** \"Ако `getBaseNightlyRate()` не бъде извикан нито веднъж — как ще разберете?\"\n\n**Казвате:** \"`assertEquals` ще хване грешката — резултатът ще е `0.0`, не `240.0`. Не ни трябва `verify()`. Мокът е излишен свидетел тук.\"\n\n---\n\n### Стъпка 3 — ръчен стъб\n\n**Питате:** \"Има ли по-прост начин от три реда `when()`?\"\n\n**Показвате** `FakeRoomType`:\n\n```java\nclass FakeRoomType implements RoomType {\n    private final double baseRate;\n    private final double weekendSurcharge;\n    private final int maxOccupancy;\n\n    FakeRoomType(double baseRate, double weekendSurcharge, int maxOccupancy) {\n        this.baseRate = baseRate;\n        this.weekendSurcharge = weekendSurcharge;\n        this.maxOccupancy = maxOccupancy;\n    }\n\n    @Override public double getBaseNightlyRate() { return baseRate; }\n    @Override public double getWeekendSurcharge() { return weekendSurcharge; }\n    @Override public int getMaxOccupancy() { return maxOccupancy; }\n}\n```\n\n**Показвате** новия setup:\n\n```java\nHotelPricing pricing = new HotelPricing(new FakeRoomType(80.0, 0.30, 2));\n```\n\n**Пускате тестовете.** Пак зелено.\n\n**Питате:** \"Кой вариант е по-четим?\"\n\n---\n\n### Стъпка 4 — дискусия: мок vs стъб\n\n**Показвате** таблицата:\n\n| | Мок | Стъб |\n|---|---|---|\n| Проверява | поведение (`verify`) | стойност (`assertEquals`) |\n| Нужен при | side effect зависимости | query зависимости |\n| Пример | `CalendarInviteSender` | `RoomType` |\n\n**Казвате:** \"`RoomType` само чете данни — нула side effects. `CalendarInviteSender` изпраща покани — side effect. Command → мок. Query → стъб.\"\n\n---\n\n## Очаквани тестове\n\n### Вариант А — с мок\n\n```java\nclass HotelPricingTest {\n\n    HotelPricing pricing;\n\n    @BeforeEach\n    void setUp() {\n        RoomType room = mock(RoomType.class);\n        when(room.getBaseNightlyRate()).thenReturn(80.0);\n        when(room.getWeekendSurcharge()).thenReturn(0.30);\n        when(room.getMaxOccupancy()).thenReturn(2);\n        pricing = new HotelPricing(room);\n    }\n\n    @Test\n    void testCalculateStayNoWeekendNights() {\n        assertEquals(240.0, pricing.calculateStay(3, 0, 2));\n    }\n\n    @Test\n    void testCalculateStayWithOneWeekendNight() {\n        assertEquals(264.0, pricing.calculateStay(3, 1, 2));\n    }\n\n    @Test\n    void testCalculateStayTooManyGuestsThrows() {\n        assertThrows(IllegalArgumentException.class,\n            () -> pricing.calculateStay(3, 0, 5));\n    }\n}\n```\n\n### Вариант Б — с ръчен стъб\n\n```java\nclass HotelPricingTest {\n\n    HotelPricing pricing;\n\n    @BeforeEach\n    void setUp() {\n        pricing = new HotelPricing(new FakeRoomType(80.0, 0.30, 2));\n    }\n\n    @Test\n    void testCalculateStayNoWeekendNights() {\n        assertEquals(240.0, pricing.calculateStay(3, 0, 2));\n    }\n\n    @Test\n    void testCalculateStayWithOneWeekendNight() {\n        assertEquals(264.0, pricing.calculateStay(3, 1, 2));\n    }\n\n    @Test\n    void testCalculateStayTooManyGuestsThrows() {\n        assertThrows(IllegalArgumentException.class,\n            () -> pricing.calculateStay(3, 0, 5));\n    }\n}\n```\n"}, {"id": "06", "title": "AI тестове", "md": "# AI тестове\n\n## Цел\n\nДемонстрация (не задача за студентите). Показва как AI генерира тестове спрямо имплементацията, не спрямо спецификацията — и активно скрива бъг зад зелен тест. Бонус: double precision капан. **~10 минути.**\n\n---\n\n## Условие\n\nИзползвайки AI tool по ваш избор, генерирайте тестове за следния клас — **без да подавате спецификацията**. Какъв е резултатът?\n\n```java\nclass ShippingCalculator {\n\n    double calculateShippingCost(double weightKg, double orderTotal) {\n        double base = 2.50 + weightKg * 1.50;\n        if (orderTotal > 100.0) {\n            return base * 0.50;\n        }\n        return base;\n    }\n}\n```\n\n**Спецификация:**\n- Базова такса: 2.50€\n- По 1.50€/кг\n- Поръчки над **50€** → 50% отстъпка на доставката\n\n---\n\n## Стъпки и изпълнение\n\n### Стъпка 1 — показвате имплементацията\n\n**Показвате** кода на лаптопа — с бъга вътре (`> 100.0`), без да го споменавате.\n\n**Питате:** \"Изглежда ли ви правилно?\"\n\n**Изчаквате.** Повечето ще кажат \"да\" — `> 100` изглежда разумно на пръв поглед.\n\n---\n\n### Стъпка 2 — питате AI\n\n**Показвате** prompt-а на екрана:\n\n```\nWrite JUnit 5 tests for this method:\n\nclass ShippingCalculator {\n    double calculateShippingCost(double weightKg, double orderTotal) {\n        double base = 2.50 + weightKg * 1.50;\n        if (orderTotal > 100.0) {\n            return base * 0.50;\n        }\n        return base;\n    }\n}\n\nSpec: base fee 2.50€ + 1.50€/kg. Orders over 50€ get 50% discount on shipping.\n```\n\n**Казвате:** \"Включваме правилния праг — 50€ — в prompt-а.\"\n\n---\n\n### Стъпка 3 — AI-генерираните тестове\n\n**Показвате** резултата от AI (очакван):\n\n```java\nclass ShippingCalculatorTest {\n\n    ShippingCalculator calculator = new ShippingCalculator();\n\n    @Test\n    void testNoDiscount() {\n        assertEquals(4.0, calculator.calculateShippingCost(1.0, 30.0));\n    }\n\n    @Test\n    void testWithDiscount() {\n        assertEquals(2.75, calculator.calculateShippingCost(2.0, 150.0), 0.001);\n    }\n\n    @Test\n    void testZeroWeight() {\n        assertEquals(2.5, calculator.calculateShippingCost(0.0, 10.0));\n    }\n}\n```\n\n**Пускате тестовете.** Всички зелени.\n\n**Питате:** \"Доволни ли сте от тези тестове?\"\n\n**Изчаквате.** После:\n\n**Питате:** \"Какъв е `orderTotal` в `testWithDiscount`?\"\n\n**Казвате:** \"150. Над и двата прага — 50 и 100. AI е написал тест, който *изглежда* като тества discount-а, но минава и с двете стойности.\"\n\n---\n\n### Стъпка 4 — разкривате бъга\n\n**Питате:** \"Колко струва доставката при поръчка от **75€** и 2кг?\"\n\n**Изчаквате** пресмятане от студентите:\n- Спецификацията: 75 > 50 → отстъпка → `(2.50 + 2 × 1.50) × 0.50 = 2.75€`\n- Имплементацията: 75 < 100 → без отстъпка → `2.50 + 2 × 1.50 = 5.50€`\n\n**Показвате** разкриващия тест:\n\n```java\n@Test\nvoid testOrderBetween50And100GetsDiscount() {\n    assertEquals(2.75, calculator.calculateShippingCost(2.0, 75.0), 0.001);\n}\n```\n\n**Пускате теста.** Червено.\n\n**Казвате:** \"Бъгът е разкрит. AI не само не го е хванал — активно го е скрил зад зелен тест с `orderTotal = 150`.\"\n\n---\n\n### Стъпка 5 — double капанът (бонус)\n\n**Питате:** \"Защо `testWithDiscount` има `0.001`, а `testNoDiscount` няма?\"\n\n**Показвате:**\n\n```java\nSystem.out.println(0.1 + 0.2); // 0.30000000000000004\n```\n\n**Казвате:** \"`4.0` и `2.5` са точно представими в IEEE 754. `0.50 × 5.50` — не винаги. При умножение/деление с нецели числа — добавете делта или ползвайте `BigDecimal`.\"\n\n---\n\n## Поанта\n\n**Казвате:** \"В Задача 2 писахте тестовете преди кода. Тук AI пише тестовете след кода. Вижда ли се разликата?\"\n\nAI верифицира имплементацията, не спецификацията. Граничният случай (зоната 50–100) не се тества, защото кодът не го обработва различно — AI не го \"вижда\".\n"}];
function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function inline(s) {
  const codes = [];
  s = s.replace(/`([^`]+)`/g, (_, c) => {
    codes.push(c);
    return "\\u0000" + (codes.length - 1) + "\\u0000";
  });
  s = escapeHtml(s);
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/\*([^*]+)\*/g, "<em>$1</em>");
  s = s.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
  s = s.replace(/\\u0000(\d+)\\u0000/g, (_, i) => "<code>" + escapeHtml(codes[+i]) + "</code>");
  return s;
}
function renderMarkdown(md) {
  // Pass through raw HTML blocks (lines starting with <table, <tr, <th, <td, </table, etc.)
  const lines = md.split("\n");
  let html = "", i = 0, listStack = [];
  function closeListsTo(indent) {
    while (listStack.length && listStack[listStack.length - 1].indent >= indent) html += "</" + listStack.pop().type + ">";
  }
  function closeAllLists() {
    while (listStack.length) html += "</" + listStack.pop().type + ">";
  }
  while (i < lines.length) {
    let line = lines[i];
    // Raw HTML passthrough (table rows and block-level html)
    if (/^\s*<(table|thead|tbody|tr|th|td|\/table|\/thead|\/tbody|\/tr)/.test(line)) {
      closeAllLists();
      html += line + "\n";
      i++; continue;
    }
    const fence = line.match(/^```(\w*)\s*$/);
    if (fence) {
      closeAllLists();
      const language = fence[1] || "text";
      let code = [];
      i++;
      while (i < lines.length && !/^```\s*$/.test(lines[i])) code.push(lines[i++]);
      i++;
      html += '<div class="code-wrap"><button class="copy-btn" type="button">Копирай кода</button><pre><code class="language-' + language + '">' + escapeHtml(code.join("\n")) + '</code></pre></div>';
      continue;
    }
    const h = line.match(/^(#{1,4})\s+(.*)$/);
    if (h) {
      closeAllLists();
      const level = h[1].length;
      const tag = "<h" + level + ">" + inline(h[2].trim()) + "</h" + level + ">";
      html += level === 1 ? "<div style='display:block'>" + tag + "</div>" : tag;
      i++; continue;
    }
    const li = line.match(/^(\s*)([-*]|\d+\.)\s+(.*)$/);
    if (li) {
      const indent = li[1].length, type = /\d+\./.test(li[2]) ? "ol" : "ul";
      if (!listStack.length || indent > listStack[listStack.length - 1].indent) {
        html += "<" + type + ">"; listStack.push({type, indent});
      } else {
        closeListsTo(indent + 1);
        if (!listStack.length || listStack[listStack.length - 1].indent < indent) {
          html += "<" + type + ">"; listStack.push({type, indent});
        }
      }
      html += "<li>" + inline(li[3].trim()) + "</li>";
      i++; continue;
    }
    if (/^---+$/.test(line.trim())) { closeAllLists(); i++; continue; }
    if (/^\s*$/.test(line)) { closeAllLists(); i++; continue; }
    closeAllLists();
    let para = [line]; i++;
    while (i < lines.length && !/^\s*$/.test(lines[i]) && !/^(#{1,4})\s/.test(lines[i]) &&
           !/^```/.test(lines[i]) && !/^(\s*)([-*]|\d+\.)\s+/.test(lines[i]) &&
           !/^\s*<(table|thead|tbody|tr|th|td|\/table|\/thead|\/tbody|\/tr)/.test(lines[i])) para.push(lines[i++]);
    html += "<p>" + para.map(inline).join("<br>") + "</p>";
  }
  closeAllLists();
  return html;
}

const navEl = document.getElementById("nav");
const contentEl = document.getElementById("content");
const crumbEl = document.getElementById("crumb");
const mainEl = document.getElementById("main");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
let current = 0;

function buildNav() {
  PROBLEMS.forEach((p, idx) => {
    const btn = document.createElement("button");
    btn.className = "nav-item";
    btn.innerHTML = '<span class="nav-num">' + p.id + '</span><span class="nav-label">' + p.title + '</span>';
    btn.addEventListener("click", () => show(idx));
    navEl.appendChild(btn);
  });
}
function extractStudentMd(md) {
  // Show only ## Условие (and ## Hint as collapsible) — everything else is for TAs
  const sections = {};
  const parts = md.split(/(?=^## )/m);
  for (const part of parts) {
    const hMatch = part.match(/^## ([^\n]+)/);
    if (hMatch) sections[hMatch[1].trim()] = part;
  }
  const titleMatch = md.match(/^# .+$/m);
  let body = titleMatch ? titleMatch[0] + "\n\n" : "";
  if (sections["Условие"]) body += sections["Условие"];
  const hint = sections["Hint"] ? sections["Hint"].replace(/^## Hint[ \t]*\n/, "") : null;
  return { body: body.trimEnd(), hint };
}

function show(idx) {
  current = Math.max(0, Math.min(PROBLEMS.length - 1, idx));
  const p = PROBLEMS[current];
  const { body, hint } = extractStudentMd(p.md);
  let html = renderMarkdown(body);
  if (hint) {
    html += '<details class="hint"><summary>Hint</summary><div class="hint-body">' +
      renderMarkdown(hint) + '</div></details>';
  }
  contentEl.innerHTML = html;
  crumbEl.textContent = "Задача " + p.id + " от " + PROBLEMS.length + " · " + p.title;
  [...navEl.children].forEach((c, i) => c.classList.toggle("active", i === current));
  prevBtn.disabled = current === 0;
  nextBtn.disabled = current === PROBLEMS.length - 1;
  mainEl.scrollTop = 0;
  if (history.replaceState) history.replaceState(null, "", "#" + p.id);
}
contentEl.addEventListener("click", async (event) => {
  const button = event.target.closest(".copy-btn");
  if (!button) return;
  const code = button.parentElement.querySelector("pre code").innerText;
  try {
    await navigator.clipboard.writeText(code);
    button.textContent = "Копирано!";
    button.classList.add("copied");
    setTimeout(() => { button.textContent = "Копирай кода"; button.classList.remove("copied"); }, 1400);
  } catch (error) {
    button.textContent = "Маркирай кода, за да го копираш";
  }
});
prevBtn.addEventListener("click", () => show(current - 1));
nextBtn.addEventListener("click", () => show(current + 1));
document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
  if (e.key === "ArrowLeft") show(current - 1);
  else if (e.key === "ArrowRight") show(current + 1);
  else if (/^[1-6]$/.test(e.key)) show(+e.key - 1);
});

const themeBtn = document.getElementById("themeBtn");
const themeIcon = document.getElementById("themeIcon");
const themeText = document.getElementById("themeText");
function applyTheme(t) {
  document.documentElement.setAttribute("data-theme", t);
  const dark = t === "dark";
  themeIcon.textContent = dark ? "☀️" : "🌙";
  themeText.textContent = dark ? "Светла" : "Тъмна";
  try { localStorage.setItem("weekly-tasks-theme", t); } catch (e) {}
}
themeBtn.addEventListener("click", () => {
  const cur = document.documentElement.getAttribute("data-theme");
  applyTheme(cur === "dark" ? "light" : "dark");
});
let scale = 19;
function applyScale() {
  document.documentElement.style.setProperty("--content-scale", scale + "px");
  try { localStorage.setItem("weekly-tasks-scale", scale); } catch (e) {}
}
document.getElementById("zoomIn").addEventListener("click", () => { scale = Math.min(30, scale + 2); applyScale(); });
document.getElementById("zoomOut").addEventListener("click", () => { scale = Math.max(14, scale - 2); applyScale(); });
(function init() {
  let theme = "light";
  try { theme = localStorage.getItem("weekly-tasks-theme") || "light"; } catch (e) {}
  applyTheme(theme);
  try {
    const savedScale = parseInt(localStorage.getItem("weekly-tasks-scale"), 10);
    if (!isNaN(savedScale)) scale = savedScale;
  } catch (e) {}
  applyScale();
  buildNav();
  const hash = (location.hash || "").replace("#", "");
  const startIdx = PROBLEMS.findIndex((p) => p.id === hash);
  show(startIdx >= 0 ? startIdx : 0);
})();
</script>
