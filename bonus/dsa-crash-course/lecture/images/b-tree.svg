<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="400" viewBox="0 0 1240 400" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="black"/>
    </marker>
  </defs>

  <style>
    .val     { fill: #4a90d9; stroke: #000; stroke-width: 1; }
    .ptr     { fill: #fff;    stroke: #000; stroke-width: 1; }
    .header  { fill: #2f6db5; stroke: #000; stroke-width: 1.5; }
    .htext   { fill: #fff; font-size: 13px; }
    .vtext   { fill: #000; font-size: 14px; }
    .label   { fill: #000; font-size: 13px; }
    .dot     { fill: #000; }
    .nullln  { stroke: #000; stroke-width: 1.3; }
    .edge    { fill: none; stroke: #000; stroke-width: 1.5; }
  </style>

  <!-- =========================== ROOT NODE =========================== -->
  <!-- ptr(26) val(40) x4, 5 ptrs -> width 290. Centered over child span (mid 620): x0 = 620 - 145 = 475 -->
  <rect class="header" x="475" y="30" width="290" height="22"/>
  <text class="htext" x="620" y="45" text-anchor="middle">Root Node</text>

  <g>
    <rect class="ptr" x="475" y="52" width="26" height="40"/>
    <circle class="dot" cx="488" cy="72" r="4.5"/>
    <rect class="val" x="501" y="52" width="40" height="40"/>
    <text class="vtext" x="521" y="77" text-anchor="middle">30</text>
    <rect class="ptr" x="541" y="52" width="26" height="40"/>
    <circle class="dot" cx="554" cy="72" r="4.5"/>
    <rect class="val" x="567" y="52" width="40" height="40"/>
    <text class="vtext" x="587" y="77" text-anchor="middle">60</text>
    <rect class="ptr" x="607" y="52" width="26" height="40"/>
    <circle class="dot" cx="620" cy="72" r="4.5"/>
    <rect class="val" x="633" y="52" width="40" height="40"/>
    <text class="vtext" x="653" y="77" text-anchor="middle">90</text>
    <rect class="ptr" x="673" y="52" width="26" height="40"/>
    <circle class="dot" cx="686" cy="72" r="4.5"/>
    <rect class="val" x="699" y="52" width="40" height="40"/>
    <text class="vtext" x="719" y="77" text-anchor="middle">120</text>
    <rect class="ptr" x="739" y="52" width="26" height="40"/>
    <circle class="dot" cx="752" cy="72" r="4.5"/>
  </g>

  <!-- =========================== EDGES root -> children =========================== -->
  <!-- arrows start from the black circle (cy=72) ; child bodies start at y=205 ; target y=203 ; child centers: 140,380,620,860,1100 -->
  <path class="edge" d="M488,72 V135 H140 V203" marker-end="url(#arrow)"/>
  <path class="edge" d="M554,72 V155 H380 V203" marker-end="url(#arrow)"/>
  <path class="edge" d="M620,72 V175 H620 V203" marker-end="url(#arrow)"/>
  <path class="edge" d="M686,72 V155 H860 V203" marker-end="url(#arrow)"/>
  <path class="edge" d="M752,72 V135 H1100 V203" marker-end="url(#arrow)"/>

  <!-- =========================== CHILD NODES =========================== -->
  <!-- node width = 200 : ptr(16) val(30) x4 + 5 ptrs. body y=205..243 (center 224). leaf arrows to y=280. -->
  <!-- offsets: 40,280,520,760,1000 (center = offset+100). dot x: 8,54,100,146,192 ; val cx: 31,77,123,169 -->
  <!-- labels: two lines above node top, left-aligned at x=0, y=185/197 -->

  <!-- ===== Child Node 1 : values 10,20,25 ; last value empty ; one NULL ptr ===== -->
  <g transform="translate(40,0)">
    <text class="label" x="0" y="185" text-anchor="start">Child</text>
    <text class="label" x="0" y="197" text-anchor="start">Node 1</text>
    <rect class="ptr" x="0" y="205" width="16" height="38"/>
    <circle class="dot" cx="8" cy="224" r="3.8"/>
    <rect class="val" x="16" y="205" width="30" height="38"/>
    <text class="vtext" x="31" y="229" text-anchor="middle">12</text>
    <rect class="ptr" x="46" y="205" width="16" height="38"/>
    <line class="nullln" x1="46" y1="205" x2="62" y2="243"/>
    <line class="nullln" x1="62" y1="205" x2="46" y2="243"/>
    <rect class="val" x="62" y="205" width="30" height="38"/>
    <text class="vtext" x="77" y="229" text-anchor="middle">19</text>
    <rect class="ptr" x="92" y="205" width="16" height="38"/>
    <circle class="dot" cx="100" cy="224" r="3.8"/>
    <rect class="val" x="108" y="205" width="30" height="38"/>
    <text class="vtext" x="123" y="229" text-anchor="middle">24</text>
    <rect class="ptr" x="138" y="205" width="16" height="38"/>
    <circle class="dot" cx="146" cy="224" r="3.8"/>
    <rect class="val" x="154" y="205" width="30" height="38"/>
    <text class="vtext" x="169" y="229" text-anchor="middle">28</text>
    <rect class="ptr" x="184" y="205" width="16" height="38"/>
    <circle class="dot" cx="192" cy="224" r="3.8"/>
    <line class="edge" x1="8"   y1="224" x2="8"   y2="280" marker-end="url(#arrow)"/>
    <line class="edge" x1="100" y1="224" x2="100" y2="280" marker-end="url(#arrow)"/>
    <line class="edge" x1="146" y1="224" x2="146" y2="280" marker-end="url(#arrow)"/>
    <line class="edge" x1="192" y1="224" x2="192" y2="280" marker-end="url(#arrow)"/>
  </g>

  <!-- ===== Child Node 2 : values 40,50,55 ; one NULL ptr ===== -->
  <g transform="translate(280,0)">
