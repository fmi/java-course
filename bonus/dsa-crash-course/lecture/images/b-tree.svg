    <text class="label" x="0" y="197" text-anchor="start">Node 3</text>
    <rect class="ptr" x="0" y="205" width="16" height="38"/>
    <circle class="dot" cx="8" cy="224" r="3.8"/>
    <rect class="val" x="16" y="205" width="30" height="38"/>
    <text class="vtext" x="31" y="229" text-anchor="middle">62</text>
    <rect class="ptr" x="46" y="205" width="16" height="38"/>
    <circle class="dot" cx="54" cy="224" r="3.8"/>
    <rect class="val" x="62" y="205" width="30" height="38"/>
    <text class="vtext" x="77" y="229" text-anchor="middle">81</text>
    <rect class="ptr" x="92" y="205" width="16" height="38"/>
    <circle class="dot" cx="100" cy="224" r="3.8"/>
    <rect class="val" x="108" y="205" width="30" height="38"/>
    <text class="vtext" x="123" y="229" text-anchor="middle">86</text>
    <rect class="ptr" x="138" y="205" width="16" height="38"/>
    <circle class="dot" cx="146" cy="224" r="3.8"/>
    <rect class="val" x="154" y="205" width="30" height="38"/>
    <rect class="ptr" x="184" y="205" width="16" height="38"/>
    <line class="nullln" x1="184" y1="205" x2="200" y2="243"/>
    <line class="nullln" x1="200" y1="205" x2="184" y2="243"/>
    <line class="edge" x1="8"   y1="224" x2="8"   y2="280" marker-end="url(#arrow)"/>
    <line class="edge" x1="54"  y1="224" x2="54"  y2="280" marker-end="url(#arrow)"/>
    <line class="edge" x1="100" y1="224" x2="100" y2="280" marker-end="url(#arrow)"/>
    <line class="edge" x1="146" y1="224" x2="146" y2="280" marker-end="url(#arrow)"/>
  </g>

  <!-- ===== Child Node 4 : values 100,110,115 ; all ptrs valid ===== -->
  <g transform="translate(760,0)">
    <text class="label" x="0" y="185" text-anchor="start">Child</text>
    <text class="label" x="0" y="197" text-anchor="start">Node 4</text>
    <rect class="ptr" x="0" y="205" width="16" height="38"/>
    <circle class="dot" cx="8" cy="224" r="3.8"/>
    <rect class="val" x="16" y="205" width="30" height="38"/>
    <text class="vtext" x="31" y="229" text-anchor="middle">99</text>
    <rect class="ptr" x="46" y="205" width="16" height="38"/>
    <circle class="dot" cx="54" cy="224" r="3.8"/>
    <rect class="val" x="62" y="205" width="30" height="38"/>
    <text class="vtext" x="77" y="229" text-anchor="middle">111</text>
    <rect class="ptr" x="92" y="205" width="16" height="38"/>
    <circle class="dot" cx="100" cy="224" r="3.8"/>
    <rect class="val" x="108" y="205" width="30" height="38"/>
    <text class="vtext" x="123" y="229" text-anchor="middle">114</text>
    <rect class="ptr" x="138" y="205" width="16" height="38"/>
    <circle class="dot" cx="146" cy="224" r="3.8"/>
    <rect class="val" x="154" y="205" width="30" height="38"/>
    <text class="vtext" x="169" y="229" text-anchor="middle">117</text>
    <rect class="ptr" x="184" y="205" width="16" height="38"/>
    <circle class="dot" cx="192" cy="224" r="3.8"/>
    <line class="edge" x1="8"   y1="224" x2="8"   y2="280" marker-end="url(#arrow)"/>
    <line class="edge" x1="54"  y1="224" x2="54"  y2="280" marker-end="url(#arrow)"/>
    <line class="edge" x1="100" y1="224" x2="100" y2="280" marker-end="url(#arrow)"/>
    <line class="edge" x1="146" y1="224" x2="146" y2="280" marker-end="url(#arrow)"/>
    <line class="edge" x1="192" y1="224" x2="192" y2="280" marker-end="url(#arrow)"/>
  </g>

  <!-- ===== Child Node 5 : values 130,140,150 ; one NULL ptr ===== -->
  <g transform="translate(1000,0)">
    <text class="label" x="0" y="185" text-anchor="start">Child</text>
    <text class="label" x="0" y="197" text-anchor="start">Node 5</text>
    <rect class="ptr" x="0" y="205" width="16" height="38"/>
    <circle class="dot" cx="8" cy="224" r="3.8"/>
    <rect class="val" x="16" y="205" width="30" height="38"/>
    <text class="vtext" x="31" y="229" text-anchor="middle">128</text>
    <rect class="ptr" x="46" y="205" width="16" height="38"/>
    <line class="nullln" x1="46" y1="205" x2="62" y2="243"/>
    <line class="nullln" x1="62" y1="205" x2="46" y2="243"/>
    <rect class="val" x="62" y="205" width="30" height="38"/>
    <text class="vtext" x="77" y="229" text-anchor="middle">138</text>
    <rect class="ptr" x="92" y="205" width="16" height="38"/>
    <circle class="dot" cx="100" cy="224" r="3.8"/>
    <rect class="val" x="108" y="205" width="30" height="38"/>
    <text class="vtext" x="123" y="229" text-anchor="middle">151</text>
    <rect class="ptr" x="138" y="205" width="16" height="38"/>
    <circle class="dot" cx="146" cy="224" r="3.8"/>
    <rect class="val" x="154" y="205" width="30" height="38"/>
    <text class="vtext" x="169" y="229" text-anchor="middle">203</text>
    <rect class="ptr" x="184" y="205" width="16" height="38"/>
    <circle class="dot" cx="192" cy="224" r="3.8"/>
    <line class="edge" x1="8"   y1="224" x2="8"   y2="280" marker-end="url(#arrow)"/>
    <line class="edge" x1="100" y1="224" x2="100" y2="280" marker-end="url(#arrow)"/>
    <line class="edge" x1="146" y1="224" x2="146" y2="280" marker-end="url(#arrow)"/>
    <line class="edge" x1="192" y1="224" x2="192" y2="280" marker-end="url(#arrow)"/>
