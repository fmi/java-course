    --shadow: 6px 6px 0 var(--ink);
    --shadow-lg: 10px 10px 0 var(--ink);

  }

  [data-theme="dark"] {
    --bg: #1b1b1b;
    --surface: #262626;
    --surface-2: #333333;
    --ink: #000000;

    --text-dim: #b8b8b8;

    --accent-2: #5b8cff;

    width: var(--sidebar-w);
    flex-shrink: 0;
    background: var(--surface);
    border-right: var(--bw) solid var(--ink);
    display: flex;
    flex-direction: column;
    height: 100%;
    z-index: 2;
  }

  .sidebar-head {
    padding: 22px 20px 18px;
    border-bottom: var(--bw) solid var(--ink);
    background: var(--accent);
    color: #111111;
  }

  .sidebar-head .eyebrow {
    display: inline-block;
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 800;
    margin: 0 0 8px;
    background: #111111;
    color: #ffffff;
    padding: 4px 9px;
    border: var(--bw) solid var(--ink);
    box-shadow: 3px 3px 0 #ffffff;
    transform: rotate(-2deg);
  }

  .sidebar-head h1 {
    font-size: 30px;
    margin: 0;
    font-weight: 900;
    letter-spacing: -0.02em;
    text-transform: uppercase;
    line-height: 0.95;
  }

  nav {
    flex: 1;
    overflow-y: auto;
    padding: 18px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    text-align: left;
    background: var(--surface);
    border: var(--bw) solid var(--ink);
    color: var(--text);
    font-size: 16px;
    font-weight: 700;
    padding: 12px 12px;
    cursor: pointer;
    font-family: inherit;
    box-shadow: var(--shadow);
    transition: transform 0.08s ease, box-shadow 0.08s ease, background 0.08s ease;
  }

  .nav-item:hover {
    transform: translate(-2px, -2px);
    box-shadow: 8px 8px 0 var(--ink);
    background: var(--surface-2);
  }

  .nav-item:active { transform: translate(2px, 2px); box-shadow: 3px 3px 0 var(--ink); }

  .nav-item.active {
    background: var(--accent-2);
    color: #ffffff;
    transform: translate(-2px, -2px);
    box-shadow: 8px 8px 0 var(--ink);
  }

  .nav-num {
    flex-shrink: 0;
    width: 34px;
    height: 34px;
    background: #111111;
    color: #ffffff;
    border: var(--bw) solid var(--ink);
    display: grid;
    place-items: center;
    font-size: 15px;
    font-weight: 900;
  }

  .nav-item.active .nav-num { background: var(--accent-3); color: #111111; }

  .sidebar-foot {
    padding: 14px 16px;
    border-top: var(--bw) solid var(--ink);

    gap: 10px;

    color: #111111;

    font-family: inherit;

  .theme-btn:hover { transform: translate(-2px,-2px); box-shadow: 6px 6px 0 var(--ink); }

  .zoom-btn {

    border: var(--bw) solid var(--ink);

    height: 38px;
    cursor: pointer;

    font-weight: 900;
    font-family: inherit;
    display: grid;
    place-items: center;

  /* chunky scrollbars */

<script>
const PROBLEMS = [{"id": "01", "title": "Box", "md": "# Задача 1: Box\n\nИмплементирайте клас `Box`, който представя стойност, която може да липсва.\n\nКласът трябва да предоставя следната функционалност:\n\n- `ofNullable` – създава инстанция, съдържаща подадената стойност. Стойността може да бъде `null`.\n- `isEmpty` – проверява дали инстанцията съдържа стойност.\n- `getOrElse` – връща съдържаната стойност или подадена стойност по подразбиране, ако инстанцията е празна.\n\nКласът трябва да запазва типа на съдържаната стойност, така че извличането ѝ да не изисква явни преобразувания (casts).\n\n## Решение\n\nНаправете `Box` генеричен по типа на стойността си: `Box<T>`. Статичният factory метод `ofNullable` декларира собствен типов параметър, така че компилаторът извежда `T` от аргумента, а `getOrElse` връща `T` без нужда от cast.\n\n```java\nclass Box<T> {\n\n    private final T value;\n\n    private Box(T value) {\n        this.value = value;\n    }\n\n    static <T> Box<T> ofNullable(T value) {\n        return new Box<>(value);\n    }\n\n    boolean isEmpty() {\n        return value == null;\n    }\n\n    T getOrElse(T defaultValue) {\n        if (isEmpty()) {\n            return defaultValue;\n        }\n        return value;\n    }\n}\n```"}, {"id": "02", "title": "Трансформиране на Box", "md": "# Задача 2: Трансформиране на Box\n\nРазширете имплементацията на `Box` с операция за трансформация, наречена `transform`.\n\nОперацията приема обект, който отговаря за трансформирането на съдържаната стойност в стойност от друг тип, и връща нов `Box`, съдържащ трансформираната стойност.\n\nАко оригиналният `Box` е празен, резултатът също трябва да бъде празен, а трансформацията не трябва да се изпълнява.\n\n## Пример за използване\n\nСледващият пример показва как трябва да се използва трансформацията. Имплементацията на `StringLengthOperation` е дадена; ваша задача е да проектирате абстракцията, която ѝ позволява да работи с `Box`.\n\n```java\nBox<String> optional = Box.ofNullable(\"hello\");\n\nBox<Number> length = optional.transform(\n        new StringLengthOperation()\n);\n\nSystem.out.println(length.getOrElse(-1)); // 5\n```\n\nПримерната операция:\n\n```java\nclass StringLengthOperation {\n    public Integer transform(CharSequence value) {\n        return value.length();\n    }\n}\n```\n\nНе променяйте примера за използване. Имплементацията ви трябва да го поддържа, като запазва типовата безопасност и не използва явни преобразувания (casts).\n\n## Решение\n\nВъведете генерична абстракция за трансформация и накарайте `StringLengthOperation` да я имплементира.\n\n**Обърнете внимание:** `StringLengthOperation` е `BoxTransformer<CharSequence, Integer>`, но се използва върху `Box<String>`, за да се получи `Box<Number>`. Със сигнатура `BoxTransformer<T, U>` този пример няма да се компилира.\n\n- `? super T` – трансформаторът може да приема всеки супертип на стойността (`CharSequence` за `String`). Той само **консумира** `T`.\n- `? extends U` – трансформаторът може да връща всеки подтип на типа на резултата (`Integer` за `Number`). Той само **произвежда** `U`.\n\n```java\ninterface BoxTransformer<I, O> {\n    O transform(I value);\n}\n\nclass StringLengthOperation implements BoxTransformer<CharSequence, Integer> {\n    public Integer transform(CharSequence value) {\n        return value.length();\n    }\n}\n\nclass Box<T> {\n\n    private final T value;\n\n    private Box(T value) {\n        this.value = value;\n    }\n\n    static <T> Box<T> ofNullable(T value) {\n        return new Box<>(value);\n    }\n\n    boolean isEmpty() {\n        return value == null;\n    }\n\n    T getOrElse(T defaultValue) {\n        if (isEmpty()) {\n            return defaultValue;\n        }\n        return value;\n    }\n\n    <U> Box<U> transform(BoxTransformer<? super T, ? extends U> transformer) {\n        if (isEmpty()) {\n            return empty();\n        }\n        return ofNullable(transformer.transform(value));\n    }\n\n    private static <U> Box<U> empty() {\n        return new Box<>(null);\n    }\n}\n```"}, {"id": "03", "title": "Потребителска кошница", "md": "# Задача 3: Потребителска кошница\n\nПредставете си два магазина: магазин за дрехи и магазин за храна. И двата магазина работят с обща пазарска кошница.\n\nДадени са следните домейн класове:\n\n```java\ninterface Clothes {\n    int size();\n}\n\nrecord Shirt(int size) implements Clothes {}\n\ninterface Food {\n    int calories();\n}\n\nrecord Apple(int calories) implements Food {}\n```\n\nИмплементирайте следната функционалност.\n\n**ClothesStore**\n- `sellShirt` – добавя нова риза в подадената кошница.\n- `printClothesSize` – отпечатва размерите на всички дрехи в подадената кошница.\n\n**FoodStore**\n- `sellApple` – добавя нова ябълка в подадената кошница.\n- `printFoodCalories` – отпечатва калориите на всички храни в подадената кошница.\n\nИмплементацията трябва да бъде типово безопасна и не трябва да използва явни преобразувания (casts).\n\n## Решение\n\nИзползвайте wildcards за параметъра на кошницата според това какво прави всеки метод с нея (PECS: *Producer Extends, Consumer Super*).\n\n- Продажбата **добавя** в кошницата, т.е. кошницата е консуматор: `List<? super Shirt>` / `List<? super Apple>`. Така методът приема `List<Shirt>`, `List<Clothes>` или общия `List<Object>`.\n- Отпечатването **чете** от кошницата, т.е. кошницата е производител: `List<? extends Clothes>` / `List<? extends Food>`.\n\n**Дискусия:** С общ `List<Object>` и двата магазина могат да продават, но нито един от методите за отпечатване не го приема. Защо? Един `List<Object>` може да съдържа `Apple`, така че компилаторът не може да гарантира, че всеки елемент е `Clothes`.\n\n```java\nimport java.util.List;\n\ninterface Clothes {\n    int size();\n}\n\nrecord Shirt(int size) implements Clothes {}\n\ninterface Food {\n    int calories();\n}\n\nrecord Apple(int calories) implements Food {}\n\nclass ClothesStore {\n    static void sellShirt(List<? super Shirt> basket) {\n        basket.add(new Shirt(42));\n    }\n\n    static void printClothesSize(List<? extends Clothes> basket) {\n        for (Clothes clothes : basket) {\n            System.out.println(clothes.size());\n        }\n    }\n}\n\nclass FoodStore {\n    static void sellApple(List<? super Apple> basket) {\n        basket.add(new Apple(25));\n    }\n\n    static void printFoodCalories(List<? extends Food> basket) {\n        for (Food food : basket) {\n            System.out.println(food.calories());\n        }\n    }\n}\n```"}, {"id": "04", "title": "Ресторантски pipeline", "md": "# Задача 4: Ресторантски pipeline\n\nИмплементирайте pipeline за обработка на задачи (jobs), който позволява няколко независими операции да бъдат свързани и изпълнени последователно.\n\nДадени са следните домейн класове:\n\n```java\nclass Order {}\nclass ValidatedOrder extends Order {}\n\nclass Meal {}\nclass Pizza extends Meal {}\nclass Pasta extends Meal {}\n\nclass ServedOrder {}\n```\n\nДадени са и следните конкретни jobs. Имплементациите на методите им са умишлено опростени; съсредоточете се върху проектирането на абстракциите, които позволяват те да бъдат свързвани.\n\n```java\nclass ValidateOrderJob {\n    public ValidatedOrder execute(Order order) {\n        System.out.println(\"Executing \" + getClass().getSimpleName());\n        return new ValidatedOrder();\n    }\n}\n\nclass PreparePizzaJob {\n    public Meal execute(ValidatedOrder order) {\n        System.out.println(\"Executing \" + getClass().getSimpleName());\n        return new Pizza();\n    }\n}\n\nclass ServeMealJob {\n    public ServedOrder execute(Meal meal) {\n        System.out.println(\"Executing \" + getClass().getSimpleName());\n        return new ServedOrder();\n    }\n}\n```\n\nВашият pipeline трябва да поддържа следната функционалност:\n\n- `start` – създава pipeline от начален job.\n- `then` – свързва още един job към съществуващия pipeline.\n- `execute` – изпълнява целия pipeline с подаден начален вход и връща крайния резултат.\n\nPipeline-ът трябва да запазва типа на първоначалния си вход и типа на крайния си изход. Jobs не трябва да се изпълняват, когато се добавят към pipeline-а; те трябва да се изпълняват едва когато се изпълни самият pipeline.\n\n## Очаквано използване\n\nИмплементацията ви трябва да поддържа този пример:\n\n```java\npublic class PipelineMain {\n\n    static void main() {\n        Pipeline<Order, ServedOrder> pipeline =\n                Pipeline.start(new ValidateOrderJob())\n                        .then(new PreparePizzaJob())\n                        .then(new ServeMealJob());\n\n        ServedOrder result = pipeline.execute(new Order());\n    }\n}\n```\n\n## Решение\n\nВъведете генеричен интерфейс `Job<I, O>`, който всеки job имплементира. `Pipeline<I, O>` обвива един-единствен job; `then` свързва текущия job със следващия в нов job `I -> N`. Нищо не се изпълнява, докато не бъде извикан `execute`.\n\n**Обърнете внимание:** `then(Job<O, N> next)` изисква типът на изхода на текущия job да съвпада точно с типа на входа на следващия. Дадените jobs си пасват точно (`Order -> ValidatedOrder -> Meal -> ServedOrder`), затова засега не са нужни wildcards. Задача 5 премахва това ограничение.\n\n```java\ninterface Job<I, O> {\n    O execute(I input);\n}\n\nclass Pipeline<I, O> {\n\n    private final Job<I, O> job;\n\n    private Pipeline(Job<I, O> job) {\n        this.job = job;\n    }\n\n    static <I, O> Pipeline<I, O> start(Job<I, O> job) {\n        return new Pipeline<>(job);\n    }\n\n    <N> Pipeline<I, N> then(Job<O, N> next) {\n        Job<I, N> composedJob = new Job<>() {\n            @Override\n            public N execute(I input) {\n                return next.execute(job.execute(input));\n            }\n        };\n\n        return new Pipeline<>(composedJob);\n    }\n\n    O execute(I input) {\n        return job.execute(input);\n    }\n}\n\nclass ValidateOrderJob implements Job<Order, ValidatedOrder> {\n    public ValidatedOrder execute(Order order) {\n        System.out.println(\"Executing \" + getClass().getSimpleName());\n        return new ValidatedOrder();\n    }\n}\n\nclass PreparePizzaJob implements Job<ValidatedOrder, Meal> {\n    public Meal execute(ValidatedOrder order) {\n        System.out.println(\"Executing \" + getClass().getSimpleName());\n        return new Pizza();\n    }\n}\n\nclass ServeMealJob implements Job<Meal, ServedOrder> {\n    public ServedOrder execute(Meal meal) {\n        System.out.println(\"Executing \" + getClass().getSimpleName());\n        return new ServedOrder();\n    }\n}\n```"}, {"id": "05", "title": "Гъвкав pipeline", "md": "# Задача 5: По-гъвкав pipeline\n\nПродължете работа с имплементацията си от Задача 4.\n\nДадени са следните допълнителни домейн класове и job:\n\n```java\nclass Dessert extends Meal {}\nclass IceCream extends Dessert {}\n\nclass PrepareIceCreamJob {\n    public IceCream execute(ValidatedOrder order) {\n        System.out.println(\"Executing \" + getClass().getSimpleName());\n        return new IceCream();\n    }\n}\n```\n\nТекущата имплементация на pipeline-а изисква типът на изхода на един job да съвпада точно с типа на входа на следващия. Това ограничение не позволява някои напълно валидни комбинации от jobs.\n\nРазширете pipeline-а така, че да поддържа съвместими типове, дори когато декларираните им типове не са еднакви.\n\nНапример:\n\n- Job, който произвежда `IceCream`, трябва да може да бъде последван от job, който приема `Meal`.\n- Job, който произвежда `IceCream`, трябва да бъде съвместим с pipeline, чийто деклариран тип на изхода е `Meal`.\n\nPipeline-ът трябва да остане типово безопасен, да запазва типа на първоначалния си вход и да не използва явни преобразувания (casts).\n\nПримерът от Задача 4 трябва да продължи да работи, а следните допълнителни примери също трябва да се компилират:\n\n```java\nPipeline<Order, Meal> pipeline =\n        Pipeline.start(new ValidateOrderJob())\n                .then(new PrepareIceCreamJob());\n\nPipeline<Order, ServedOrder> dessertPipeline =\n        Pipeline.start(new ValidateOrderJob())\n                .then(new PrepareIceCreamJob())\n                .then(new ServeMealJob());\n```\n\nВие трябва да прецените как да обобщите операцията за свързване, така че да поддържа тези комбинации.\n\n## Решение\n\nОбобщете `then` от `Job<O, N>` до `Job<? super O, ? extends N>`.\n\n- `? super O` – следващият job може да приема супертип на текущия изход (`ServeMealJob` приема `Meal` след job, който произвежда `IceCream`).\n- `? extends N` – следващият job може да произвежда подтип на декларирания изход (`PrepareIceCreamJob` произвежда `IceCream` за `Pipeline<Order, Meal>`).\n\n**Покажете:** със сигнатурата от Задача 4 всеки от новите примери се проваля по различна причина:\n\n- `Pipeline<Order, Meal> pipeline` – `N` се извежда точно като `IceCream`, а `Pipeline<Order, IceCream>` не е `Pipeline<Order, Meal>`: *inference variable N has incompatible equality constraints Meal, IceCream*. Поправя се с `? extends N`.\n- `dessertPipeline` – `ServeMealJob` е `Job<Meal, ServedOrder>`, но `then` очаква `Job<IceCream, N>`: *method then in class Pipeline<I,O> cannot be applied to given types*. Поправя се с `? super O`.\n\n```java\ninterface Job<I, O> {\n    O execute(I input);\n}\n\nclass Pipeline<I, O> {\n\n    private final Job<I, O> job;\n\n    private Pipeline(Job<I, O> job) {\n        this.job = job;\n    }\n\n    static <I, O> Pipeline<I, O> start(Job<I, O> job) {\n        return new Pipeline<>(job);\n    }\n\n    <N> Pipeline<I, N> then(Job<? super O, ? extends N> next) {\n        Job<I, N> composedJob = new Job<>() {\n            @Override\n            public N execute(I input) {\n                return next.execute(job.execute(input));\n            }\n        };\n\n        return new Pipeline<>(composedJob);\n    }\n\n    O execute(I input) {\n        return job.execute(input);\n    }\n}\n\nclass Dessert extends Meal {}\nclass IceCream extends Dessert {}\n\nclass ValidateOrderJob implements Job<Order, ValidatedOrder> {\n    public ValidatedOrder execute(Order order) {\n        System.out.println(\"Executing \" + getClass().getSimpleName());\n        return new ValidatedOrder();\n    }\n}\n\nclass PreparePizzaJob implements Job<ValidatedOrder, Meal> {\n    public Meal execute(ValidatedOrder order) {\n        System.out.println(\"Executing \" + getClass().getSimpleName());\n        return new Pizza();\n    }\n}\n\nclass ServeMealJob implements Job<Meal, ServedOrder> {\n    public ServedOrder execute(Meal meal) {\n        System.out.println(\"Executing \" + getClass().getSimpleName());\n        return new ServedOrder();\n    }\n}\n\nclass PrepareIceCreamJob implements Job<ValidatedOrder, IceCream> {\n    public IceCream execute(ValidatedOrder order) {\n        System.out.println(\"Executing \" + getClass().getSimpleName());\n        return new IceCream();\n    }\n}\n```"}];

function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function inline(s) {
  const codes = [];
  s = s.replace(/`([^`]+)`/g, (_, c) => {
    codes.push(c);
    return "\\u0000" + (codes.length - 1) + "\\u0000";
  });
  s = escapeHtml(s);
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/\*([^*]+)\*/g, "<em>$1</em>");
  s = s.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
  s = s.replace(/\\u0000(\d+)\\u0000/g, (_, i) => "<code>" + escapeHtml(codes[+i]) + "</code>");
  return s;
}
function renderMarkdown(md) {
  const lines = md.split("\n");
  let html = "", i = 0, listStack = [];
  function closeListsTo(indent) {
    while (listStack.length && listStack[listStack.length - 1].indent >= indent) html += "</" + listStack.pop().type + ">";
  }
  function closeAllLists() {
    while (listStack.length) html += "</" + listStack.pop().type + ">";
  }
  while (i < lines.length) {
    let line = lines[i];
    const fence = line.match(/^```(\w*)\s*$/);
    if (fence) {
      closeAllLists();
      const language = fence[1] || "text";
      let code = [];
      i++;
      while (i < lines.length && !/^```\s*$/.test(lines[i])) code.push(lines[i++]);
      i++;
      html += '<div class="code-wrap"><button class="copy-btn" type="button">Копирай кода</button><pre><code class="language-' + language + '">' + escapeHtml(code.join("\n")) + '</code></pre></div>';
      continue;
    }
    const h = line.match(/^(#{1,4})\s+(.*)$/);
    if (h) {
      closeAllLists();
      const level = h[1].length;
      html += "<h" + level + ">" + inline(h[2].trim()) + "</h" + level + ">";
      i++; continue;
    }
    const li = line.match(/^(\s*)([-*]|\d+\.)\s+(.*)$/);
    if (li) {
      const indent = li[1].length, type = /\d+\./.test(li[2]) ? "ol" : "ul";
      if (!listStack.length || indent > listStack[listStack.length - 1].indent) {
        html += "<" + type + ">"; listStack.push({type, indent});
      } else {
        closeListsTo(indent + 1);
        if (!listStack.length || listStack[listStack.length - 1].indent < indent) {
          html += "<" + type + ">"; listStack.push({type, indent});
        }
      }
      html += "<li>" + inline(li[3].trim()) + "</li>";
      i++; continue;
    }
    if (/^\s*$/.test(line)) { closeAllLists(); i++; continue; }
    closeAllLists();
    let para = [line]; i++;
    while (i < lines.length && !/^\s*$/.test(lines[i]) && !/^(#{1,4})\s/.test(lines[i]) &&
           !/^```/.test(lines[i]) && !/^(\s*)([-*]|\d+\.)\s+/.test(lines[i])) para.push(lines[i++]);
    html += "<p>" + para.map(inline).join("<br>") + "</p>";
  }
  closeAllLists();
  return html;
}

const navEl = document.getElementById("nav");
const contentEl = document.getElementById("content");
const crumbEl = document.getElementById("crumb");
const mainEl = document.getElementById("main");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
let current = 0;

function buildNav() {
  PROBLEMS.forEach((p, idx) => {
    const btn = document.createElement("button");
    btn.className = "nav-item";
    btn.innerHTML = '<span class="nav-num">' + p.id + '</span><span class="nav-label">' + p.title + '</span>';
    btn.addEventListener("click", () => show(idx));
    navEl.appendChild(btn);
  });
}
function show(idx) {
  current = Math.max(0, Math.min(PROBLEMS.length - 1, idx));
  const p = PROBLEMS[current];
  // Everything after a "## Решение" heading is rendered inside a collapsed <details>
  const parts = p.md.split(/^## Решение[ \t]*$/m);
  let html = renderMarkdown(parts[0]);
  if (parts.length > 1) {
    html += '<details class="solution"><summary>Решение</summary><div class="solution-body">' +
      renderMarkdown(parts.slice(1).join("")) + '</div></details>';
  }
  contentEl.innerHTML = html;
  crumbEl.textContent = "Задача " + p.id + " от " + PROBLEMS.length + " · " + p.title;
  [...navEl.children].forEach((c, i) => c.classList.toggle("active", i === current));
  prevBtn.disabled = current === 0;
  nextBtn.disabled = current === PROBLEMS.length - 1;
  mainEl.scrollTop = 0;
  if (history.replaceState) history.replaceState(null, "", "#" + p.id);
}
contentEl.addEventListener("click", async (event) => {
  const button = event.target.closest(".copy-btn");
  if (!button) return;
  const code = button.parentElement.querySelector("pre code").innerText;
  try {
    await navigator.clipboard.writeText(code);
    button.textContent = "Копирано!";
    button.classList.add("copied");
    setTimeout(() => { button.textContent = "Копирай кода"; button.classList.remove("copied"); }, 1400);
  } catch (error) {
    button.textContent = "Маркирай кода, за да го копираш";
  }
});
prevBtn.addEventListener("click", () => show(current - 1));
nextBtn.addEventListener("click", () => show(current + 1));
document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
  if (e.key === "ArrowLeft") show(current - 1);
  else if (e.key === "ArrowRight") show(current + 1);
  else if (/^[1-5]$/.test(e.key)) show(+e.key - 1);
});

const themeBtn = document.getElementById("themeBtn");
const themeIcon = document.getElementById("themeIcon");
const themeText = document.getElementById("themeText");
function applyTheme(t) {
  document.documentElement.setAttribute("data-theme", t);
  const dark = t === "dark";
  themeIcon.textContent = dark ? "☀️" : "🌙";
  themeText.textContent = dark ? "Светла" : "Тъмна";
  try { localStorage.setItem("weekly-tasks-theme", t); } catch (e) {}
}
themeBtn.addEventListener("click", () => {
  const cur = document.documentElement.getAttribute("data-theme");
  applyTheme(cur === "dark" ? "light" : "dark");
});
let scale = 19;
function applyScale() {
  document.documentElement.style.setProperty("--content-scale", scale + "px");
  try { localStorage.setItem("weekly-tasks-scale", scale); } catch (e) {}
}
document.getElementById("zoomIn").addEventListener("click", () => { scale = Math.min(30, scale + 2); applyScale(); });
document.getElementById("zoomOut").addEventListener("click", () => { scale = Math.max(14, scale - 2); applyScale(); });
(function init() {
  let theme = "light";
  try { theme = localStorage.getItem("weekly-tasks-theme") || "light"; } catch (e) {}
  applyTheme(theme);
  try {
    const savedScale = parseInt(localStorage.getItem("weekly-tasks-scale"), 10);
    if (!isNaN(savedScale)) scale = savedScale;
  } catch (e) {}
  applyScale();
  buildNav();
  const hash = (location.hash || "").replace("#", "");
  const startIdx = PROBLEMS.findIndex((p) => p.id === hash);
  show(startIdx >= 0 ? startIdx : 0);
})();
</script>
