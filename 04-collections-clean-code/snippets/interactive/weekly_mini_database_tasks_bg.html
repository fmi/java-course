<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Database — Седмични задачи</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffe066;
    --surface: #ffffff;
    --surface-2: #fff0f3;
    --ink: #111111;
    --text: #111111;
    --text-dim: #444444;
    --accent: #ff5c8a;
    --accent-2: #5b8cff;
    --accent-3: #27d07a;
    --code-bg: #111111;
    --code-text: #f6f6f6;
    --shadow: 6px 6px 0 var(--ink);
    --shadow-lg: 10px 10px 0 var(--ink);
    --bw: 3px;
    --radius: 0px;
    --sidebar-w: 320px;
  }

  [data-theme="dark"] {
    --bg: #1b1b1b;
    --surface: #262626;
    --surface-2: #333333;
    --ink: #000000;
    --text: #f5f5f5;
    --text-dim: #b8b8b8;
    --accent: #ff5c8a;
    --accent-2: #5b8cff;
    --accent-3: #27d07a;
    --code-bg: #0a0a0a;
    --code-text: #f6f6f6;
    --shadow: 6px 6px 0 #000000;
    --shadow-lg: 10px 10px 0 #000000;
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; padding: 0; height: 100%; }

  body {
    font-family: "Rubik", "Arial Black", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    height: 100vh;
    overflow: hidden;
    transition: background 0.15s ease, color 0.15s ease;
  }

  /* ===== Sidebar ===== */
  aside {
    width: var(--sidebar-w);
    flex-shrink: 0;
    background: var(--surface);
    border-right: var(--bw) solid var(--ink);
    display: flex;
    flex-direction: column;
    height: 100%;
    z-index: 2;
  }

  .sidebar-head {
    padding: 22px 20px 18px;
    border-bottom: var(--bw) solid var(--ink);
    background: var(--accent);
    color: #111111;
  }

  .sidebar-head .eyebrow {
    display: inline-block;
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 800;
    margin: 0 0 8px;
    background: #111111;
    color: #ffffff;
    padding: 4px 9px;
    border: var(--bw) solid var(--ink);
    box-shadow: 3px 3px 0 #ffffff;
    transform: rotate(-2deg);
  }

  .sidebar-head h1 {
    font-size: 30px;
    margin: 0;
    font-weight: 900;
    letter-spacing: -0.02em;
    text-transform: uppercase;
    line-height: 0.95;
  }

  nav {
    flex: 1;
    overflow-y: auto;
    padding: 18px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    text-align: left;
    background: var(--surface);
    border: var(--bw) solid var(--ink);
    color: var(--text);
    font-size: 16px;
    font-weight: 700;
    padding: 12px 12px;
    cursor: pointer;
    font-family: inherit;
    box-shadow: var(--shadow);
    transition: transform 0.08s ease, box-shadow 0.08s ease, background 0.08s ease;
  }

  .nav-item:hover {
    transform: translate(-2px, -2px);
    box-shadow: 8px 8px 0 var(--ink);
    background: var(--surface-2);
  }

  .nav-item:active { transform: translate(2px, 2px); box-shadow: 3px 3px 0 var(--ink); }

  .nav-item.active {
    background: var(--accent-2);
    color: #ffffff;
    transform: translate(-2px, -2px);
    box-shadow: 8px 8px 0 var(--ink);
  }

  .nav-num {
    flex-shrink: 0;
    width: 34px;
    height: 34px;
    background: #111111;
    color: #ffffff;
    border: var(--bw) solid var(--ink);
    display: grid;
    place-items: center;
    font-size: 15px;
    font-weight: 900;
  }

  .nav-item.active .nav-num { background: var(--accent-3); color: #111111; }

  .nav-label { line-height: 1.1; }

  .sidebar-foot {
    padding: 14px 16px;
    border-top: var(--bw) solid var(--ink);
    display: flex;
    gap: 10px;
    align-items: center;
    justify-content: space-between;
    background: var(--surface-2);
  }

  .theme-btn {
    background: var(--accent-3);
    border: var(--bw) solid var(--ink);
    color: #111111;
    padding: 9px 12px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 800;
    font-family: inherit;
    display: flex;
    align-items: center;
    gap: 7px;
    box-shadow: 4px 4px 0 var(--ink);
    transition: transform 0.08s ease, box-shadow 0.08s ease;
  }

  .theme-btn:hover { transform: translate(-2px,-2px); box-shadow: 6px 6px 0 var(--ink); }
  .theme-btn:active { transform: translate(2px,2px); box-shadow: 2px 2px 0 var(--ink); }

  .zoom-group { display: flex; gap: 8px; }

  .zoom-btn {
    background: var(--accent);
    border: var(--bw) solid var(--ink);
    color: #111111;
    width: 38px;
    height: 38px;
    cursor: pointer;
    font-size: 20px;
    font-weight: 900;
    font-family: inherit;
    display: grid;
    place-items: center;
    box-shadow: 4px 4px 0 var(--ink);
    transition: transform 0.08s ease, box-shadow 0.08s ease;
  }

  .zoom-btn:hover { transform: translate(-2px,-2px); box-shadow: 6px 6px 0 var(--ink); }
  .zoom-btn:active { transform: translate(2px,2px); box-shadow: 2px 2px 0 var(--ink); }

  /* ===== Main ===== */
  main {
    flex: 1;
    overflow-y: auto;
    height: 100%;
    scroll-behavior: smooth;
    background:
      repeating-linear-gradient(45deg, transparent, transparent 22px, rgba(0,0,0,0.03) 22px, rgba(0,0,0,0.03) 23px),
      var(--bg);
  }

  [data-theme="dark"] main {
    background:
      repeating-linear-gradient(45deg, transparent, transparent 22px, rgba(255,255,255,0.03) 22px, rgba(255,255,255,0.03) 23px),
      var(--bg);
  }

  .content-wrap {
    max-width: 880px;
    margin: 0 auto;
    padding: 48px 48px 120px;
    font-size: var(--content-scale, 19px);
  }

  .topbar {
    position: sticky;
    top: 0;
    z-index: 5;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 24px;
    background: var(--surface);
    border-bottom: var(--bw) solid var(--ink);
  }

  .crumb {
    font-size: 13px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: #111111;
    background: var(--accent-3);
    border: var(--bw) solid var(--ink);
    padding: 6px 11px;
    box-shadow: 3px 3px 0 var(--ink);
  }

  .nav-arrows { display: flex; gap: 10px; }

  .arrow-btn {
    background: var(--surface);
    border: var(--bw) solid var(--ink);
    color: var(--text);
    padding: 9px 16px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 800;
    font-family: inherit;
    box-shadow: 4px 4px 0 var(--ink);
    transition: transform 0.08s ease, box-shadow 0.08s ease, background 0.08s ease;
  }

  .arrow-btn:hover:not(:disabled) {
    transform: translate(-2px,-2px);
    box-shadow: 6px 6px 0 var(--ink);
    background: var(--accent-2);
    color: #ffffff;
  }
  .arrow-btn:active:not(:disabled) { transform: translate(2px,2px); box-shadow: 2px 2px 0 var(--ink); }
  .arrow-btn:disabled { opacity: 0.4; cursor: default; box-shadow: 2px 2px 0 var(--ink); }

  /* ===== Rendered markdown ===== */
  .md h1 {
    font-size: 2.3em;
    font-weight: 900;
    letter-spacing: -0.03em;
    text-transform: uppercase;
    line-height: 1.02;
    margin: 0 0 0.7em;
    display: inline-block;
    background: var(--accent);
    color: #111111;
    padding: 12px 18px;
    border: var(--bw) solid var(--ink);
    box-shadow: var(--shadow-lg);
  }
  .md h2 {
    font-size: 1.4em;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: -0.01em;
    margin: 1.7em 0 0.6em;
    display: inline-block;
    background: var(--accent-2);
    color: #ffffff;
    padding: 6px 14px;
    border: var(--bw) solid var(--ink);
    box-shadow: 5px 5px 0 var(--ink);
  }
  .md h3 { font-size: 1.12em; font-weight: 800; margin: 1.3em 0 0.4em; text-transform: uppercase; }
  .md p { line-height: 1.7; margin: 0.85em 0; font-weight: 500; }
  .md ul, .md ol { line-height: 1.7; padding-left: 1.3em; margin: 0.85em 0; }
  .md li { margin: 0.4em 0; font-weight: 500; }
  .md ul { list-style: none; padding-left: 0; }
  .md ul > li { position: relative; padding-left: 1.5em; }
  .md ul > li::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0.5em;
    width: 12px;
    height: 12px;
    background: var(--accent);
    border: 2px solid var(--ink);
  }
  .md ul ul { padding-left: 1.2em; margin: 0.3em 0; }
  .md ul ul > li::before { background: var(--accent-2); }
  .md li > ul, .md li > ol { margin: 0.3em 0; }
  .md a { color: var(--text); font-weight: 700; text-decoration: none; background: var(--accent-3); padding: 1px 5px; border: 2px solid var(--ink); box-shadow: 2px 2px 0 var(--ink); }
  .md a:hover { background: var(--accent); }
  .md strong { font-weight: 900; }
  .md blockquote {
    margin: 1.1em 0;
    padding: 14px 18px;
    border: var(--bw) solid var(--ink);
    background: var(--accent);
    color: #111111;
    box-shadow: var(--shadow);
    font-weight: 700;
  }
  .md blockquote p { margin: 0.2em 0; }
  .md blockquote code { background: #111111; color: #ffffff; }
  .md code {
    font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
    background: var(--surface-2);
    border: 2px solid var(--ink);
    padding: 0.08em 0.4em;
    font-size: 0.84em;
    font-weight: 700;
  }
  .md pre {
    background: var(--code-bg);
    color: var(--code-text);
    border: var(--bw) solid var(--ink);
    padding: 20px 22px;
    overflow-x: auto;
    margin: 1.2em 0;
    line-height: 1.55;
    box-shadow: var(--shadow);
  }
  .md pre code {
    background: none;
    border: none;
    padding: 0;
    font-size: 0.9em;
    color: var(--code-text);
    font-weight: 500;
  }

  /* chunky scrollbars */
  nav::-webkit-scrollbar, main::-webkit-scrollbar { width: 14px; }
  nav::-webkit-scrollbar-track, main::-webkit-scrollbar-track { background: var(--surface-2); border-left: 2px solid var(--ink); }
  nav::-webkit-scrollbar-thumb, main::-webkit-scrollbar-thumb { background: var(--accent); border: 2px solid var(--ink); }

  @media (max-width: 760px) {
    :root { --sidebar-w: 100%; }
    body { flex-direction: column; overflow: auto; }
    aside { height: auto; border-right: none; border-bottom: var(--bw) solid var(--ink); }
    nav { flex-direction: row; overflow-x: auto; padding: 12px; }
    .nav-item { white-space: nowrap; }
    .nav-label { display: none; }
    .content-wrap { padding: 28px 20px 80px; }
    .md h1 { font-size: 1.7em; }
  }

.code-wrap { position: relative; margin: 1.2em 0; }
.code-wrap pre { margin: 0; padding-top: 52px; }
.copy-btn {
  position: absolute; top: 10px; right: 10px; z-index: 1;
  border: 2px solid var(--ink); background: var(--accent-3); color: #111;
  padding: 7px 11px; font: 800 13px inherit; cursor: pointer;
  box-shadow: 3px 3px 0 var(--ink);
}
.copy-btn:hover { transform: translate(-1px,-1px); box-shadow: 4px 4px 0 var(--ink); }
.copy-btn.copied { background: var(--accent); }

/* ===== Collapsible solutions ===== */
.solution {
  margin: 1.8em 0 1.2em;
  background: var(--surface);
  border: var(--bw) solid var(--ink);
  box-shadow: var(--shadow);
}
.solution > summary {
  list-style: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 18px;
  background: var(--accent-3);
  color: #111111;
  font-weight: 900;
  font-size: 1.05em;
  text-transform: uppercase;
  letter-spacing: 0.02em;
  user-select: none;
}
.solution > summary::-webkit-details-marker { display: none; }
.solution > summary::after {
  content: "Покажи ▾";
  font-size: 0.7em;
  font-weight: 800;
  background: #111111;
  color: #ffffff;
  padding: 4px 9px;
}
.solution[open] > summary::after { content: "Скрий ▴"; }
.solution > summary:hover { background: var(--accent); }
.solution > summary:focus-visible { outline: var(--bw) solid var(--accent-2); outline-offset: 3px; }
.solution[open] > summary { border-bottom: var(--bw) solid var(--ink); }
.solution-body { padding: 6px 22px 14px; }
</style>
</head>
<body>
  <aside>
    <div class="sidebar-head">
      <p class="eyebrow">Седмични упражнения</p>
      <h1>Mini Database</h1>
    </div>
    <nav id="nav"></nav>
    <div class="sidebar-foot">
      <button class="theme-btn" id="themeBtn" title="Смяна на темата">
        <span id="themeIcon">🌙</span><span id="themeText">Тъмна</span>
      </button>
      <div class="zoom-group">
        <button class="zoom-btn" id="zoomOut" title="По-малък текст">−</button>
        <button class="zoom-btn" id="zoomIn" title="По-голям текст">+</button>
      </div>
    </div>
  </aside>

  <main id="main">
    <div class="topbar">
      <span class="crumb" id="crumb"></span>
      <div class="nav-arrows">
        <button class="arrow-btn" id="prevBtn">← Назад</button>
        <button class="arrow-btn" id="nextBtn">Напред →</button>
      </div>
    </div>
    <div class="content-wrap">
      <article class="md" id="content"></article>
    </div>
  </main>

<script>
const PROBLEMS = [{"id": "01", "title": "Почистване на Mini Database", "md": "# Задача 1: Почистване на Mini Database\n\nЗапочвате работа в нова компания, която предлага на клиентите си in-memory база данни.\nПристигнали са нови изисквания, които трябва да имплементирате, но преди да промените каквото и да е,\nтрябва да се запознаете с кода и да се почувствате уверени в него. Отваряте файла и какво виждате… :(\n\nЗа съжаление, оригиналната имплементация не спазва много от принципите на Clean Code.\n\n**Вашата задача:** рефакторирайте съществуващата имплементация така, че да подобрите качеството на кода, без да променяте функционалността ѝ.\n\n```java\nimport java.util.*;\n\nclass user {\n    int id;\n    String n;\n    int age;\n\n    public user(int id,String n,int age){\n        this.id=id;\n        this.n=n;\n        this.age=age;\n    }\n}\n\nclass db {\n\n    public static ArrayList<user> d=new ArrayList<>();\n\n    public static void add(int id,String n,int age){\n        if(id<0 || n==null || n.length()==0 || age<0){\n            System.out.println(\"Wrong data\");\n            return;\n        }\n        d.add(new user(id,n,age));\n        System.out.println(\"User added\");\n    }\n\n    public static user find(int x){\n        for(int i=0;i<d.size();i++){\n            if(d.get(i).id==x)return d.get(i);\n        }\n        return null;\n    }\n\n    public static void print(){\n        for(user u:d){\n            System.out.println(\"User: \" + u);\n        }\n    }\n\n    public static void main(String[] args) {\n        Scanner scanner = new Scanner(System.in);\n        boolean running = true;\n\n        while (running) {\n            System.out.println(\"\\n=== Mini Database ===\");\n            System.out.println(\"1. Add user\");\n            System.out.println(\"2. Find user\");\n            System.out.println(\"3. Delete user\");\n            System.out.println(\"4. Print all users\");\n            System.out.println(\"0. Exit\");\n            System.out.print(\"Choose an option: \");\n\n            try {\n                int choice = Integer.parseInt(scanner.nextLine());\n\n                if (choice == 0) {\n                    running = false;\n                } else {\n                    handleChoice(choice, scanner);\n                }\n            } catch (NumberFormatException e) {\n                System.out.println(\"Please enter a valid number.\");\n            }\n        }\n\n        scanner.close();\n        System.out.println(\"Goodbye!\");\n    }\n\n    private static void handleChoice(int choice, Scanner scanner) {\n        switch (choice) {\n            case 1 -> {\n                System.out.print(\"ID: \");\n                int id = Integer.parseInt(scanner.nextLine());\n\n                System.out.print(\"Username: \");\n                String username = scanner.nextLine();\n\n                System.out.print(\"Age: \");\n                int age = Integer.parseInt(scanner.nextLine());\n\n                add(id, username, age);\n            }\n            case 2 -> {\n                System.out.print(\"User ID: \");\n                user foundUser = find(Integer.parseInt(scanner.nextLine()));\n\n                if (foundUser == null) {\n                    System.out.println(\"User not found.\");\n                } else {\n                    System.out.println(\"Found user\" +  foundUser);\n                }\n            }\n            case 3 -> print();\n            default -> System.out.println(\"Unknown option.\");\n        }\n    }\n}\n```"}, {"id": "02", "title": "По-бързо търсене", "md": "# Задача 2 — По-бързо търсене\n\nПотребителите се оплакват, че търсенето е бавно. Можем ли да направим нещо, за да го ускорим?\nТе са ви предоставили benchmark, с който да проверите решението си:\n\n```java\nprivate static void initDatabase(Database database) {\n    for (int i = 0; i < 1_000_000; i++) {\n        database.add(new User(i, \"user\" + i, 5 + i % 90));\n    }\n}\n\nprivate static void benchmark() {\n    Database database = new Database();\n    initDatabase(database);\n\n    int searches = 20_000;\n    long result = 0;\n\n    long start = System.nanoTime();\n\n    for (int i = 0; i < searches; i++) {\n        int id = (int) (Math.random() * 1_000_000);\n        try {\n            User user = database.find(id);\n            result += user.id();\n        } catch (DataNotFoundException e) {\n            throw new RuntimeException(e);\n        }\n    }\n\n    long elapsed = System.nanoTime() - start;\n\n    System.out.println(\"Result: \" + result);\n    System.out.println(\"Time: \" + elapsed / 1_000_000 + \" ms\");\n}\n```\n\n## Решение\n\nИзползвайте Map вместо ArrayList, за да ускорите търсенето.\n\n**Обърнете внимание:** клиент добавя двама потребители с едно и също ID, но с различни потребителски имена.\n\n- ArrayList приема и двамата потребители.\n- HashMap<Integer, User> не може да съхрани и двамата под един и същ ключ.\n- Извикването на put() със съществуващо ID замества предишния потребител.\n\n**Извод:** смяната на колекцията може да промени поведението на приложението, а не само бързодействието му."}, {"id": "03", "title": "Статистика по имена", "md": "# Задача 3 — Статистика по потребителски имена\n\nЕкипът, който администрира базата данни, иска да вижда всички регистрирани потребители, подредени азбучно по потребителско име,\nнезависимо от реда, в който са били добавени.\n\n## Решение\n\nИмплементирайте Comparator<User>, който сравнява потребителите по потребителско име.\nИзползвайте TreeSet<User>, за да върнете потребителите, сортирани по потребителско име.\n\n**Важно:** Comparator-ът определя не само наредбата, но и уникалността на елементите.\n\n**Граничен случай:** ако сравнявате само по имената, от двама потребители с еднакво име в резултата ще остане само единият.\nЗатова при еднакви имена трябва да сравните и ID-тата им:\n\n```java\npublic void demonstrateDuplicateUsername() {\n    Database database = new Database();\n    database.add(new User(1, \"alice\", 22));\n    database.add(new User(2, \"alice\", 30));\n\n    System.out.println(\"Users sorted by username:\");\n    System.out.println(database.sortedUsers());\n}\n```"}, {"id": "04", "title": "Уникални имена", "md": "# Задача 4 — Без повтарящи се потребителски имена\n\nНово изискване: потребителските имена трябва да са уникални. Не бива да позволяваме двама потребители\nда се регистрират с едно и също потребителско име, независимо от ID-тата им.\n\n## Решение\n\nИзползвайте Set, за да проверявате дали дадено потребителско име вече е заето.\n\n**За дискусия:** сравнението на имената е чувствително към малки и главни букви. \"Alice\" и \"alice\" едно и също име ли са, или различни?\n\n**Как да го поправим:** преобразувайте името с `toLowerCase()`, преди да го добавите в Set-а."}, {"id": "05", "title": "Статистика по възраст", "md": "# Задача 5 — Статистика по възраст\n\nНово изискване: екипът, който администрира базата данни, иска да вижда всички различни възрасти на регистрираните потребители\nи колко потребители има с всяка от тях, винаги подредени от най-младите към най-възрастните.\n\n## Решение\n\nИзползвайте TreeMap, в който да пазите статистиката."}, {"id": "06", "title": "Достъп за четене", "md": "# Задача 6 — Достъп за четене\n\nДруги части на приложението трябва да показват всички потребители. Как да предоставим всички потребители на клиентите на базата данни?\n\n## Решение\n\nПърво върнете директно .values() на Map-а и обяснете защо някой отвън може да го промени.\n\nСлед това върнете unmodifiable Collection от .values() на Map-а.\n\n- Collections.unmodifiableCollection(data.values()) връща unmodifiable view. То продължава да отразява промените, направени през базата данни.\n- List.copyOf(data.values()) връща immutable snapshot (копие). То не отразява последващите промени."}, {"id": "07", "title": "Само 18+", "md": "# Задача 7 — Само 18+\n\nАдминистраторите искат да премахнат всички потребители под 18 години.\n\n## Решение\n\nИзтриването на потребител променя статистиката по възраст. Въведохме ли бъг? Как да го поправим?\n\nПокажете ConcurrentModificationException, който се получава, ако обхождаме .values() с for-each:\n\n```java\npublic void removeUnderaged() {\n    for (User user : data.values()) {\n        if (user.age() < 18) {\n            data.remove(user.id()); // ConcurrentModificationException\n        }\n    }\n}\n```\n\n**Правилна имплементация:**\n\n```java\npublic void removeUnderaged() {\n    Iterator<User> iterator = data.values().iterator();\n\n    while (iterator.hasNext()) {\n        User user = iterator.next();\n\n        if (user.age() < 18) {\n            iterator.remove();\n        }\n    }\n}\n```"}, {"id": "08", "title": "Голямото предизвикателство", "md": "# Задача 8 — Голямото предизвикателство (домашно за ентусиастите)\n\nБазата данни трябва да поддържа отложено изпълнение на тежки операции.\n\nИма два вида операции: AddOperation и FindOperation.\n\nБазата данни трябва да има метод `void submit(operation)`, чрез който се подава операция. Тя все още не се изпълнява.\n\nБазата данни има и метод `void executePending()`, който изпълнява чакащите операции в реда, в който са постъпили.\n\nКоя структура от данни е най-подходяща тук? Как бихте моделирали операциите, така че дизайнът да е чист и лесно разширяем?"}];

function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function inline(s) {
  const codes = [];
  s = s.replace(/`([^`]+)`/g, (_, c) => {
    codes.push(c);
    return "\\u0000" + (codes.length - 1) + "\\u0000";
  });
  s = escapeHtml(s);
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/\*([^*]+)\*/g, "<em>$1</em>");
  s = s.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
  s = s.replace(/\\u0000(\d+)\\u0000/g, (_, i) => "<code>" + escapeHtml(codes[+i]) + "</code>");
  return s;
}
function renderMarkdown(md) {
  const lines = md.split("\n");
  let html = "", i = 0, listStack = [];
  function closeListsTo(indent) {
    while (listStack.length && listStack[listStack.length - 1].indent >= indent) html += "</" + listStack.pop().type + ">";
  }
  function closeAllLists() {
    while (listStack.length) html += "</" + listStack.pop().type + ">";
  }
  while (i < lines.length) {
    let line = lines[i];
    const fence = line.match(/^```(\w*)\s*$/);
    if (fence) {
      closeAllLists();
      const language = fence[1] || "text";
      let code = [];
      i++;
      while (i < lines.length && !/^```\s*$/.test(lines[i])) code.push(lines[i++]);
      i++;
      html += '<div class="code-wrap"><button class="copy-btn" type="button">Копирай кода</button><pre><code class="language-' + language + '">' + escapeHtml(code.join("\n")) + '</code></pre></div>';
      continue;
    }
    const h = line.match(/^(#{1,4})\s+(.*)$/);
    if (h) {
      closeAllLists();
      const level = h[1].length;
      html += "<h" + level + ">" + inline(h[2].trim()) + "</h" + level + ">";
      i++; continue;
    }
    const li = line.match(/^(\s*)([-*]|\d+\.)\s+(.*)$/);
    if (li) {
      const indent = li[1].length, type = /\d+\./.test(li[2]) ? "ol" : "ul";
      if (!listStack.length || indent > listStack[listStack.length - 1].indent) {
        html += "<" + type + ">"; listStack.push({type, indent});
      } else {
        closeListsTo(indent + 1);
        if (!listStack.length || listStack[listStack.length - 1].indent < indent) {
          html += "<" + type + ">"; listStack.push({type, indent});
        }
      }
      html += "<li>" + inline(li[3].trim()) + "</li>";
      i++; continue;
    }
    if (/^\s*$/.test(line)) { closeAllLists(); i++; continue; }
    closeAllLists();
    let para = [line]; i++;
    while (i < lines.length && !/^\s*$/.test(lines[i]) && !/^(#{1,4})\s/.test(lines[i]) &&
           !/^```/.test(lines[i]) && !/^(\s*)([-*]|\d+\.)\s+/.test(lines[i])) para.push(lines[i++]);
    html += "<p>" + para.map(inline).join("<br>") + "</p>";
  }
  closeAllLists();
  return html;
}

const navEl = document.getElementById("nav");
const contentEl = document.getElementById("content");
const crumbEl = document.getElementById("crumb");
const mainEl = document.getElementById("main");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
let current = 0;

function buildNav() {
  PROBLEMS.forEach((p, idx) => {
    const btn = document.createElement("button");
    btn.className = "nav-item";
    btn.innerHTML = '<span class="nav-num">' + p.id + '</span><span class="nav-label">' + p.title + '</span>';
    btn.addEventListener("click", () => show(idx));
    navEl.appendChild(btn);
  });
}
function show(idx) {
  current = Math.max(0, Math.min(PROBLEMS.length - 1, idx));
  const p = PROBLEMS[current];
  // Everything after a "## Решение" heading is rendered inside a collapsed <details>
  const parts = p.md.split(/^## Решение[ \t]*$/m);
  let html = renderMarkdown(parts[0]);
  if (parts.length > 1) {
    html += '<details class="solution"><summary>Решение</summary><div class="solution-body">' +
      renderMarkdown(parts.slice(1).join("")) + '</div></details>';
  }
  contentEl.innerHTML = html;
  crumbEl.textContent = "Задача " + p.id + " от " + PROBLEMS.length + " · " + p.title;
  [...navEl.children].forEach((c, i) => c.classList.toggle("active", i === current));
  prevBtn.disabled = current === 0;
  nextBtn.disabled = current === PROBLEMS.length - 1;
  mainEl.scrollTop = 0;
  if (history.replaceState) history.replaceState(null, "", "#" + p.id);
}
contentEl.addEventListener("click", async (event) => {
  const button = event.target.closest(".copy-btn");
  if (!button) return;
  const code = button.parentElement.querySelector("pre code").innerText;
  try {
    await navigator.clipboard.writeText(code);
    button.textContent = "Копирано!";
    button.classList.add("copied");
    setTimeout(() => { button.textContent = "Копирай кода"; button.classList.remove("copied"); }, 1400);
  } catch (error) {
    button.textContent = "Маркирай кода, за да го копираш";
  }
});
prevBtn.addEventListener("click", () => show(current - 1));
nextBtn.addEventListener("click", () => show(current + 1));
document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
  if (e.key === "ArrowLeft") show(current - 1);
  else if (e.key === "ArrowRight") show(current + 1);
  else if (/^[1-8]$/.test(e.key)) show(+e.key - 1);
});

const themeBtn = document.getElementById("themeBtn");
const themeIcon = document.getElementById("themeIcon");
const themeText = document.getElementById("themeText");
function applyTheme(t) {
  document.documentElement.setAttribute("data-theme", t);
  const dark = t === "dark";
  themeIcon.textContent = dark ? "☀️" : "🌙";
  themeText.textContent = dark ? "Светла" : "Тъмна";
  try { localStorage.setItem("weekly-tasks-theme", t); } catch (e) {}
}
themeBtn.addEventListener("click", () => {
  const cur = document.documentElement.getAttribute("data-theme");
  applyTheme(cur === "dark" ? "light" : "dark");
});
let scale = 19;
function applyScale() {
  document.documentElement.style.setProperty("--content-scale", scale + "px");
  try { localStorage.setItem("weekly-tasks-scale", scale); } catch (e) {}
}
document.getElementById("zoomIn").addEventListener("click", () => { scale = Math.min(30, scale + 2); applyScale(); });
document.getElementById("zoomOut").addEventListener("click", () => { scale = Math.max(14, scale - 2); applyScale(); });
(function init() {
  let theme = "light";
  try { theme = localStorage.getItem("weekly-tasks-theme") || "light"; } catch (e) {}
  applyTheme(theme);
  try {
    const savedScale = parseInt(localStorage.getItem("weekly-tasks-scale"), 10);
    if (!isNaN(savedScale)) scale = savedScale;
  } catch (e) {}
  applyScale();
  buildNav();
  const hash = (location.hash || "").replace("#", "");
  const startIdx = PROBLEMS.findIndex((p) => p.id === hash);
  show(startIdx >= 0 ? startIdx : 0);
})();
</script>
